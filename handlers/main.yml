---

- name: remount tmp
  ansible.posix.mount:
    name: /tmp
    state: remounted

- name: remount dev_shm
  ansible.posix.mount:
    name: /dev/shm
    state: remounted

- name: remount var
  ansible.posix.mount:
    name: /var
    state: remounted

- name: remount var_tmp
  ansible.posix.mount:
    name: /var/tmp
    state: remounted

- name: remount var_log
  ansible.posix.mount:
    name: /var/log
    state: remounted

- name: remount var_log_audit
  ansible.posix.mount:
    name: /var/log/audit
    state: remounted

- name: remount home
  ansible.posix.mount:
    name: /home
    state: remounted

- name: grub update
  ansible.builtin.shell: update-grub
  notify: change requires reboot
  changed_when: true
  failed_when: false

- name: update dconf
  ansible.builtin.command: dconf update
  changed_when: true

- name: restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted

- name: restart exim4
  ansible.builtin.systemd:
    name: exim4
    state: restarted

- name: restart timeservice
  ansible.builtin.systemd:
    name: "{{ ubtu20cis_time_sync_tool }}"
    state: restarted
# ---------------
# ---------------
# This is not a control however using the iptables module only writes to memory
# if a reboot occurs that means changes can revert. This task will make the
# above iptables settings permanent
#
# This is also idempotent as a handler
# ---------------
# ---------------

- name: persistent ip4tables
  ansible.builtin.shell: bash -c "iptables-save > /etc/iptables/rules.v4"
  changed_when: ubtu20cis_iptables_save.rc == 0
  failed_when: ubtu20cis_iptables_save.rc > 0
  register: ubtu20cis_iptables_save

- name: sysctl flush ipv4 route table
  when: ansible_virtualization_type != "docker"
  ansible.posix.sysctl:
    name: net.ipv4.route.flush
    value: '1'
    sysctl_set: true

- name: reload ufw
  community.general.ufw:
    state: reloaded

- name: sysctl flush ipv6 route table
  when: ansible_virtualization_type != "docker"
  ansible.posix.sysctl:
    name: net.ipv6.route.flush
    value: '1'
    sysctl_set: true

- name: restart auditd
  when: not ubtu20cis_skip_for_travis
  tags: skip_ansible_lint
  ansible.builtin.systemd:
    name: auditd
    state: restarted

- name: restart syslog service
  ansible.builtin.systemd:
    name: "{{ ubtu20cis_syslog_service }}"
    state: restarted

- name: restart journal-upload
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: restarted

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: change requires reboot
  ansible.builtin.set_fact:
    change_requires_reboot: true
