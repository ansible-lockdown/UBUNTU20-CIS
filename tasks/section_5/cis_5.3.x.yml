- name: "5.3.3.2.1 | PATCH | Ensure the number of changed characters in a new password is configured"
  when: ubtu20cis_rule_5_3_3_2_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.2.1
    - user
    - login
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^(#\s+|)difok'
    line: 'difok = {{ ubtu20cis_pass.character_changed }}'
    create: true
    mode: 'u=rw,g=r,o='

