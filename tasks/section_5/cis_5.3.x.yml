## 5.3.3.4.x - PAM Unix configuration

- name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok"
  when:
    - ubtu20cis_rule_5_3_3_4_1
    - ubtu20cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.4.1
    - pam
  block:
    - name: "5.3.3.4.1 | AUDIT | Ensure pam_unix does not include nullok | capture state"
      ansible.builtin.shell: grep -E "pam_unix.so.*nullok" /etc/pam.d/common-* /usr/share/pam-configs/* | cut -d ':' -f1 | uniq
      changed_when: false
      failed_when: discovered_pam_nullok.rc not in [ 0, 1 ]
      register: discovered_pam_nullok

    - name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok | Ensure nullok removed"
      when: discovered_pam_nullok.stdout | length > 0
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: nullok
        replace: ''
      loop: "{{ discovered_pam_nullok.stdout_lines }}"
      notify: Pam auth update pwunix

- name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember"
  when: ubtu20cis_rule_5_3_3_4_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.4.2
    - pam
  block:
    - name: "5.3.3.4.2 | AUDIT | Ensure pam_unix does not include remember | capture state"
      ansible.builtin.shell: >-
        grep -PH -- '^\h*[^#\n\r]+\h+pam_unix\.so\b'
        /etc/pam.d/common-{password,auth,account,session,session-noninteractive}
        | grep -Pv -- '\bremember=\d\b'
      changed_when: false
      failed_when: discovered_pam_remember.rc not in [ 0, 1 ]
      register: discovered_pam_remember

    - name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember | Ensure remember removed"
      when: discovered_pam_remember.stdout | length > 0
      ansible.builtin.replace:
        path: "/{{ ubtu20cis_pam_confd_dir }}{{ ubtu20cis_pam_pwunix_file }}"
        regexp: remember=\d+
        replace: ''
      notify: Pam auth update pwunix

- name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm"
  when: ubtu20cis_rule_5_3_3_4_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.4.3
    - pamd
  block:
    - name: "5.3.3.4.3 | AUDIT | Ensure pam_unix includes a strong password hashing algorithm | Confirm pam_unix.so"
      ansible.builtin.shell: grep -E '^\s*password\s+(\S+\s+)+pam_unix\.so\s+(\S+\s+)*(sha512|yescrypt)\s*(\S+\s*)*(\s+#.*)?$' /etc/pam.d/common-password
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_pam_unix_state

    - name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm | Set hashing if pam_unix.so exists"
      when: discovered_pam_unix_state.stdout | length > 0
      community.general.pamd:
        name: common-password
        type: password
        control: '[success=1 default=ignore]'
        module_path: pam_unix.so
        module_arguments: "{{ ubtu20cis_passwd_hash_algo }}"
        state: args_present

    - name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm | Set hashing if pam_unix.so does not exist"
      when: discovered_pam_unix_state.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        line: 'password        [success=1 default=ignore]      pam_unix.so {{ ubtu20cis_passwd_hash_algo }}'
        insertafter: '^# end of pam-auth-update config'

    - name: "5.3.3.4.3 | AUDIT | Ensure pam_unix includes a strong password hashing algorithm | capture hash"
      ansible.builtin.shell: cat /etc/shadow | awk -F':' '{print $1" "$2}' | grep -Ev '(!|\*)'
      # This is only looking for sha512 if yescrypt need to change the $6$ to $y$
      changed_when: false
      failed_when: false
      no_log: true
      check_mode: false
      register: discovered_passwd_hash_used

    - name: "5.3.3.4.3 | AUDIT | Ensure pam_unix includes a strong password hashing algorithm | Alert on findings"
      when: "' $6$' not in discovered_passwd_hash_used.stdout"
      ansible.builtin.debug:
        msg: "Warning!! Passwords found not using {{ ubtu20cis_passwd_hash_algo }} algorithm - This requires manual intervention"

    - name: "5.3.3.4.3 | WARN | Ensure password hashing algorithm is up to date with the latest standards | Warn Count"
      when: "' $6$' not in discovered_passwd_hash_used.stdout"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.3.3.4.3'

- name: "5.3.3.4.4 | PATCH | Ensure pam_unix includes use_authtok"
  when: ubtu20cis_rule_5_3_3_4_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.4.4
    - pam
  block:
    - name: "5.3.3.4.4 | AUDIT | Ensure pam_unix includes use_authtok | capture state"
      ansible.builtin.shell: grep -PH -- '^\h*password\h+([^#\n\r]+)\h+pam_unix\.so\h+([^#\n\r]+\h+)?use_authtok\b' /etc/pam.d/common-password
      changed_when: false
      failed_when: discovered_pam_authtok.rc not in [ 0, 1 ]
      register: discovered_pam_authtok

    - name: "5.3.3.4.4 | PATCH | Ensure pam_unix includes use_authtok | pam_files"
      when:
        - discovered_pam_authtok is defined
        - discovered_pam_authtok | length > 0
      ansible.builtin.lineinfile:
        path: "/etc/pam.d/common-password"
        regexp: ^(\s*password\s+[success=end.*]\s+pam_unix\.so)(.*)\s+use_authtok\s*=\s*\S+(.*$)
        line: \1\2\3 use_authtok
        backrefs: true
