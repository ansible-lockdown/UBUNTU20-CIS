    - rule_5.3.3.2.2
    - pam
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^(#\s*)?minlen\s*='
    line: "minlen = {{ ubtu20cis_pam_password.minlen }}"

