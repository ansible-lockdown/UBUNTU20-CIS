---

- name: "5.3.1.1 | PATCH | Ensure latest version of pam is installed"
  when:
    - ubtu20cis_rule_5_3_1_1
    - "'libpam-runtime' not in ansible_facts.packages or
      ansible_facts.packages['libpam-runtime'][0]['version'] is version('1.3.1-5', '<=')"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.1.1
    - pam
  ansible.builtin.package:
    name: libpam-runtime
    state: latest
    lock_timeout: "{{ ubtu20cis_apt_lock_timeout }}"

- name: "5.3.1.2 | PATCH | Ensure latest version of libpam-modules is installed"
  when:
    - ubtu20cis_rule_5_3_1_2
    - "'libpam-modules' not in ansible_facts.packages or
      ansible_facts.packages['libpam-modules'][0]['version'] is version('1.3.1-5', '<=')"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.1.2
    - pam
  ansible.builtin.package:
    name: libpam-modules
    state: latest
    lock_timeout: "{{ ubtu20cis_apt_lock_timeout }}"

- name: "5.3.1.3 | PATCH | Ensure libpam-pwquality is installed"
  when:
    - ubtu20cis_rule_5_3_1_3
    - "'libpam-pwquality' not in ansible_facts.packages"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - pam
    - rule_5.3.1.3
    - NIST800-53R5_NA
  ansible.builtin.package:
    name: libpam-pwquality
    state: latest
    lock_timeout: "{{ ubtu20cis_apt_lock_timeout }}"

- name: "5.3.2.1 | PATCH | Ensure pam_unix module is enabled"
  when:
    - ubtu20cis_rule_5_3_2_1
    - ubtu20cis_disruption_high
    - ubtu20cis_pam_auth_unix
    - ubtu20cis_pam_create_pamunix_file
