- name: "5.3.2.2 | PATCH | Ensure lockout for failed password attempts is configured"
  when: ubtu20cis_rule_5_3_2_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.2
    - pamd
    - notimplemented
  block:
    - name: "5.3.2.2 | PATCH | Ensure lockout for failed password attempts is configured | common-account load pam_tally"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-account
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '{{ item.after }}'
      with_items:
        - {regexp: '^account\s+requisite\s+pam_deny.so', line: 'account    requisite pam_deny.so', after: '^# here.s the fallback if no module succeeds'}
        - {regexp: '^account\s+required\s+pam_tally2.so', line: 'account    required pam_tally2.so', after: '^account    requisite pam_deny.so'}

    - name: "5.3.2.2 | PATCH | Ensure lockout for failed password attempts is configured | common-auth pam_tally2 opts"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth\s+required pam_tally2.so .*onerr=fail.*'
        line: 'auth       required pam_tally2.so {{ ubtu20cis_pamtally2_login_opts }}'
        insertafter: '^# here are the per-package modules'

- name: "5.3.2.3 | PATCH | Ensure password creation requirements are configured"
  when: ubtu20cis_rule_5_3_2_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.2.3
    - pam
  block:
    - name: "5.3.2.3 | PATCH | Ensure password creation requirements are configured | Install pam_pwquality module"
      ansible.builtin.package:
        name: libpam-pwquality
        state: present

    - name: "5.3.2.3 | PATCH | Ensure password creation requirements are configured | Add minlen"
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^minlen|^# minlen'
        line: minlen = 14

    - name: "5.3.2.3 | PATCH | Ensure password creation requirements are configured | Add minclass"
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^minclass|^# minclass'
        line: 'minclass = 4'

    - name: "5.3.2.3 | AUDIT | Ensure password creation requirements are configured | Confirm pwquality module in common-password"
      ansible.builtin.shell: grep 'password.*requisite.*pam_pwquality.so' /etc/pam.d/common-password
      changed_when: false
      failed_when: false
      check_mode: false
      register: ubtu20cis_5_3_2_3_pam_pwquality_state

    - name: "5.3.2.3 | PATCH | Ensure password creation requirements are configured | Set retry to 3 if pwquality exists"
      when: ubtu20cis_5_3_2_3_pam_pwquality_state.stdout | length > 0
      community.general.pamd:
        name: common-password
        type: password
        control: requisite
        module_path: pam_pwquality.so
        module_arguments: 'retry=3'
        state: args_present

    - name: "5.3.2.3 | PATCH | Ensure password creation requirements are configured | Set retry to 3 if pwquality does not exist"
      when: ubtu20cis_5_3_2_3_pam_pwquality_state.stdout | length == 0
      community.general.pamd:
        name: common-password
        type: password
        control: required
        module_path: pam_permit.so
        new_type: password
        new_control: requisite
        new_module_path: pam_pwquality.so
        module_arguments: 'retry=3'
        state: after

