    - level1-workstation
    - patch
    - rule_5.3.2.2
    - Pam_auth_update
    - pam_faillock
    - NIST800-53R5_NA
  ansible.builtin.template:
    src: "{{ ubtu20cis_pam_confd_dir }}{{ item }}.j2"
    dest: "/{{ ubtu20cis_pam_confd_dir }}{{ item }}"
    owner: root
    group: root
