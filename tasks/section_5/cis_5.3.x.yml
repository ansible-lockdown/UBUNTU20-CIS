    - level1-server
    - level1-workstation
    - patch
    - rule_5.3.2.1
    - Pam_auth_update
    - pam_unix
    - NIST800-53R5_IA-5
  ansible.builtin.template:
    src: "{{ ubtu20cis_pam_confd_dir }}{{ ubtu20cis_pam_pwunix_file }}.j2"
    dest: "/{{ ubtu20cis_pam_confd_dir }}{{ ubtu20cis_pam_pwunix_file }}"
    owner: root
    group: root
    mode: 'go-rwx'
  notify: Pam auth update pwunix

- name: "5.3.2.2 | PATCH | Ensure pam_faillock module is enabled"
  when:
    - ubtu20cis_rule_5_3_2_2
    - ubtu20cis_disruption_high
