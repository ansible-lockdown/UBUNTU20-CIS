- name: "5.3.3.3.1 | PATCH | Ensure password reuse is limited"
  when: ubtu20cis_rule_5_3_3_3_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.3.3.3.1
    - pamd
  block:
    - name: "5.3.3.3.1 | AUDIT | Ensure password reuse is limited | Confirm pam_pwhistory.so in common-password"
      ansible.builtin.shell: grep 'password.*required.*pam_pwhistory.so' /etc/pam.d/common-password
      changed_when: false
      failed_when: false
      check_mode: false
      register: ubtu20cis_5_3_3_3_1_pam_pwhistory_state

    - name: "5.3.3.3.1 | PATCH | Ensure password reuse is limited | Set remember value if pam_pwhistory exists"
      when: ubtu20cis_5_3_3_3_1_pam_pwhistory_state.stdout | length > 0
      community.general.pamd:
        name: common-password
        type: password
        control: required
        module_path: pam_pwhistory.so
        module_arguments: 'remember={{ ubtu20cis_passwd_remember }}'
        state: args_present

    - name: "5.3.3.3.1 | PATCH | Ensure password reuse is limited | Set remember value if pam_pwhistory does not exist"
      when: ubtu20cis_5_3_3_3_1_pam_pwhistory_state.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        line: 'password        required                        pam_pwhistory.so remember={{ ubtu20cis_passwd_remember }}'
        insertafter: '^# end of pam-auth-update config'

