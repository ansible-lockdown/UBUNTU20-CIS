---

- name: "5.1.1 | PATCH | Ensure access to /etc/ssh/sshd_config is configured"
  when: ubtu20cis_rule_5_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.1
    - ssh
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: 'u=rw,g=,o='

- name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured"
  when: ubtu20cis_rule_5_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.2
    - ssh
  block:
    - name: "5.1.2 | AUDIT | Ensure access to SSH private host key files is configured | Find ssh_host private keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
      register: discovered_ssh_host_priv_keys

    - name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured | Set permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u=rw,g=,o='
      with_items:
        - "{{ discovered_ssh_host_priv_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured"
  when: ubtu20cis_rule_5_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.3
    - ssh
  block:
    - name: "5.1.3 | AUDIT | Ensure access to SSH public host key files is configured | Find ssh_host public keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
      register: discovered_ssh_host_pub_keys

    - name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured | Set permissions"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u=rw,g=r,o=r'
      with_items:
        - "{{ discovered_ssh_host_pub_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.4 | PATCH | Ensure sshd access is configured"
  when: ubtu20cis_rule_5_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.4
    - ssh
  block:
    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add allowed users"
      when: "ubtu20cis_sshd['allow_users']|default('') != ''"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^AllowUsers|^#AllowUsers'
        line: 'AllowUsers {{ ubtu20cis_sshd.allow_users }}'
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add allowed groups"
      when: "ubtu20cis_sshd['allow_groups']|default('') != ''"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^AllowGroups|^#AllowGroups'
        line: 'AllowGroups {{ ubtu20cis_sshd.allow_groups }}'
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add deny users"
      when: "ubtu20cis_sshd['deny_users']|default('') != ''"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^DenyUsers|^#DenyUsers'
        line: 'DenyUsers {{ ubtu20cis_sshd.deny_users }}'
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add deny groups"
      when: "ubtu20cis_sshd['deny_groups']|default('') != ''"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^DenyGroups|^#DenyGroups'
        line: 'DenyGroups {{ ubtu20cis_sshd.deny_groups }}'
      notify: Restart sshd

- name: "5.1.5 | PATCH | Ensure sshd Banner is configured"
  when: ubtu20cis_rule_5_1_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.5
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Banner|^#Banner'
    line: Banner /etc/issue.net
    insertafter: '^# no default banner path'
  notify: Restart sshd

- name: "5.1.6 | PATCH | Ensure sshd Ciphers are configured"
  when: ubtu20cis_rule_5_1_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.6
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Ciphers|^#Ciphers'
    line: 'Ciphers {{ ubtu20cis_sshd.ciphers }}'
    insertafter: '^# Ciphers and keying'
  notify: Restart sshd

- name: "5.1.7 | PATCH | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured"
  when: ubtu20cis_rule_5_1_7
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.7
    - sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  with_items:
    - {regexp: '^ClientAliveInterval|^#ClientAliveInterval', line: 'ClientAliveInterval {{ ubtu20cis_sshd.client_alive_interval }}'}
    - {regexp: '^ClientAliveCountMax|^#ClientAliveCountMax', line: 'ClientAliveCountMax {{ ubtu20cis_sshd.client_alive_count_max }}'}
  notify: Restart sshd

- name: "5.1.8 | PATCH | Ensure sshd DisableForwarding is enabled"
  when: ubtu20cis_rule_5_1_8
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_5.1.8
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^DisableForwarding|^#DisableForwarding'
    line: 'DisableForwarding yes'
  notify: Restart sshd

- name: "5.1.9 | PATCH | Ensure sshd GSSAPIAuthentication is disabled"
  when: ubtu20cis_rule_5_1_9
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.9
    - sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: (?i)^(#?)\s*GSSAPIAuthentication
    line: GSSAPIAuthentication no
    validate: sshd -t -f %s
  notify: Restart sshd

- name: "5.1.10 | PATCH | Ensure sshd HostbasedAuthentication is disabled"
  when: ubtu20cis_rule_5_1_10
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.10
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^HostbasedAuthentication|^#HostbasedAuthentication'
    line: 'HostbasedAuthentication no'
  notify: Restart sshd

- name: "5.1.11 | PATCH | Ensure sshd IgnoreRhosts is enabled"
  when: ubtu20cis_rule_5_1_11
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.11
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^IgnoreRhosts|^#IgnoreRhosts'
    line: 'IgnoreRhosts yes'
  notify: Restart sshd

- name: "5.1.12 | PATCH | Ensure sshd KexAlgorithms is configured"
  when: ubtu20cis_rule_5_1_12
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.12
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^KexAlgorithms|^#KexAlgorithms'
    line: 'KexAlgorithms {{ ubtu20cis_sshd.kex_algorithms }}'
    insertafter: '^# Ciphers and keying'
  notify: Restart sshd

- name: "5.1.13 | PATCH | Ensure sshd LoginGraceTime is configured"
  when: ubtu20cis_rule_5_1_13
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.13
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^LoginGraceTime|^#LoginGraceTime'
    line: 'LoginGraceTime {{ ubtu20cis_sshd.login_grace_time }}'
    insertafter: '^# Authentication'
  notify: Restart sshd

- name: "5.1.14 | PATCH | Ensure sshd LogLevel is configured"
  when: ubtu20cis_rule_5_1_14
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.14
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^LogLevel|^#LogLevel'
    line: 'LogLevel {{ ubtu20cis_sshd.log_level }}'
    insertafter: '^# Logging'
  notify: Restart sshd

- name: "5.1.15 | PATCH | Ensure sshd MACs are configured"
  when: ubtu20cis_rule_5_1_15
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.15
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^MACs|^#MACs'
    line: 'MACs {{ ubtu20cis_sshd.macs }}'
    insertafter: '^# Ciphers and keying'
  notify: Restart sshd

- name: "5.1.16 | PATCH | Ensure sshd MaxAuthTries is configured"
  when: ubtu20cis_rule_5_1_16
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.16
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^MaxAuthTries|^#MaxAuthTries'
    line: 'MaxAuthTries {{ ubtu20cis_sshd.max_auth_tries }}'
    insertafter: '^# Authentication'
  notify: Restart sshd

- name: "5.1.17 | PATCH | Ensure sshd MaxSessions is configured"
  when: ubtu20cis_rule_5_1_17
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.17
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^MaxSessions|^#MaxSessions'
    line: 'MaxSessions {{ ubtu20cis_sshd.max_sessions }}'
    insertafter: '^# Authentication'
  notify: Restart sshd

- name: "5.1.18 | PATCH | Ensure sshd MaxStartups is configured"
  when: ubtu20cis_rule_5_1_18
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.18
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^MaxStartups|^#MaxStartups'
    line: 'MaxStartups 10:30:60'
  notify: Restart sshd

- name: "5.1.19 | PATCH | Ensure sshd PermitEmptyPasswords is disabled"
  when: ubtu20cis_rule_5_1_19
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.19
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitEmptyPasswords|^#PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'
    insertafter: '# To disable tunneled clear text passwords'
  notify: Restart sshd

- name: "5.1.20 | PATCH | Ensure sshd PermitRootLogin is disabled"
  when: ubtu20cis_rule_5_1_20
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.20
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin|^#PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart sshd

- name: "5.1.21 | PATCH | Ensure sshd PermitUserEnvironment is disabled"
  when: ubtu20cis_rule_5_1_21
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.21
    - ssh
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitUserEnvironment|^#PermitUserEnvironment'
    line: 'PermitUserEnvironment no'
  notify: Restart sshd

- name: "5.1.22 | PATCH | Ensure sshd UsePAM is enabled"
  when: ubtu20cis_rule_5_1_22
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.1.22
    - ssh
    - pam
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^UsePAM|^#UsePAM'
    line: 'UsePAM yes'
    insertafter: '^# and ChallengeResponseAuthentication'
  notify: Restart sshd
