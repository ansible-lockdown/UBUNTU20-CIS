---

- name: "5.4.1.1 | PATCH | Ensure password expiration is configured"
  when: ubtu20cis_rule_5_4_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.1.1
    - user
    - login
  block:
    - name: "5.4.1.1 | PATCH | Ensure password expiration is configured | Set /etc/login.defs PASS_MAX_DAYS"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MAX_DAYS|^#PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS {{ ubtu20cis_pass.max_days }}'
        insertafter: '# Password aging controls'

    - name: "5.4.1.1 | PATCH | Ensure password expiration is configured | Get existing users PASS_MAX_DAYS"
      ansible.builtin.shell: "awk -F: '(/^[^:]+:[^!*]/ && ($5>{{ ubtu20cis_pass.max_days }} || $5<{{ ubtu20cis_pass.min_days }} || $5 == -1)){print $1}' /etc/shadow"  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_passwd_max_days

    - name: "5.4.1.1 | PATCH | Ensure password expiration is configured | Set existing users PASS_MAX_DAYS"
      when:
        - ubtu20cis_disruption_high
        - (item != 'root') or (not ubtu20cis_uses_root)
      ansible.builtin.command: chage --maxdays {{ ubtu20cis_pass.max_days }} {{ item }}
      loop: "{{ discovered_passwd_max_days.stdout_lines }}"
      changed_when: discovered_passwd_max_days.stdout | length > 0
      failed_when: false

- name: "5.4.1.2 | PATCH | Ensure minimum password days is configured"
  when: ubtu20cis_rule_5_4_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.1.2
    - user
    - login
  block:
    - name: "5.4.1.2 | PATCH | Ensure minimum password days is configured | Set /etc/login.defs PASS_MIN_DAYS"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MIN_DAYS|^#PASS_MIN_DAYS'
        line: 'PASS_MIN_DAYS {{ ubtu20cis_pass.min_days }}'

    - name: "5.4.1.2 | PATCH | Ensure minimum password days is configured | Get existing users PASS_MIN_DAYS"
      ansible.builtin.shell: "awk -F: '(/^[^:]+:[^!*]/ && ($4<{{ ubtu20cis_pass.min_days }})) {print $1}' /etc/shadow"  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_passwd_min_days

    - name: "5.4.1.2 | PATCH | Ensure minimum password days is configured | Set existing users PASS_MIN_DAYS"
      when:
        - ubtu20cis_disruption_high
        - (item != 'root') or (not ubtu20cis_uses_root)
      ansible.builtin.command: chage --mindays {{ ubtu20cis_pass.min_days }} {{ item }}
      loop: "{{ discovered_passwd_min_days.stdout_lines }}"
      changed_when: discovered_passwd_min_days.stdout |length > 0
      failed_when: false

