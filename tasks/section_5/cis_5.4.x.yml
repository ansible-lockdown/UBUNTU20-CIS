- name: "5.4.2.6 | PATCH | Ensure root user umask is configured"
  when: ubtu20cis_rule_5_4_2_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.2.6
    - user
  block:
    - name: "5.4.2.6 | AUDIT | Ensure root user umask is configured"
      ansible.builtin.shell: grep -E '^session\s+optional\s+pam_umask.so' /etc/pam.d/common-session  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_umask_pam_status

    - name: "5.4.2.6 | PATCH | Ensure root user umask is configured"
      when: discovered_umask_pam_status.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-session
        line: 'session optional                        pam_umask.so'
        insertbefore: '^# end of pam-auth-update config'

    - name: "5.4.2.6 | PATCH | Ensure root user umask is configured"
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '(?i)(umask\s*\d\d\d)'
        line: '{{ item.line }} {{ ubtu20cis_bash_umask }}'
      with_items:
        - {path: '/etc/bash.bashrc', line: 'umask'}
        - {path: '/etc/profile', line: 'umask'}
        - {path: '/etc/login.defs', line: 'UMASK'}

    - name: "5.4.2.6 | PATCH | Ensure root user umask is configured"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^USERGROUPS_ENAB'
        line: USERGROUPS_ENAB no

- name: "5.4.2.7 | PATCH | Ensure system accounts do not have a valid login shell"
  when:
    - ubtu20cis_rule_5_4_2_7
    - ubtu20cis_disruption_high
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.2.7
    - user
    - system
  block:
    - name: "5.4.2.7 | PATCH | Ensure system accounts do not have a valid login shell | Set system accounts to nologin"
      when:
        - item != "root"
        - item != "sync"
        - item != "shutdown"
        - item != "halt"
        - item != "irc"
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /sbin/nologin
      with_items:
        - "{{ ubtu20cis_passwd | selectattr('uid', '<', 1000) | map(attribute='id') | list }}"

    - name: "5.4.2.7 | PATCH | Ensure system accounts do not have a valid login shell | Lock non-root system accounts"
      when: item != "root"
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      with_items:
        - "{{ ubtu20cis_passwd | selectattr('uid', '<', 1000) | map(attribute='id') | list }}"
      no_log: true

- name: "5.4.2.8 | PATCH | Ensure accounts without a valid login shell are locked"
  when: ubtu20cis_rule_5_4_2_8
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.2.8
    - user
  block:
    - name: "5.4.2.8 | AUDIT | Ensure accounts without a valid login shell are locked | Get valid shells"
      ansible.builtin.command: cat /etc/shells
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_valid_shells

    - name: "5.4.2.8 | AUDIT | Ensure accounts without a valid login shell are locked | Find unlocked accounts with invalid shells"
      ansible.builtin.shell: |
        awk -F: '($2 != "!" && $2 != "!!" && $2 != "*" && $2 != "" && $1 != "root") {print $1 ":" $7}' /etc/shadow |
        while IFS=: read -r user shell; do
          user_shell=$(getent passwd "$user" | cut -d: -f7)
          if ! grep -qx "$user_shell" /etc/shells 2>/dev/null; then
            echo "$user"
          fi
        done
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_unlocked_nologin_accounts

    - name: "5.4.2.8 | PATCH | Ensure accounts without a valid login shell are locked | Lock accounts"
      when: discovered_unlocked_nologin_accounts.stdout | length > 0
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      with_items: "{{ discovered_unlocked_nologin_accounts.stdout_lines }}"
      no_log: true

    - name: "5.4.2.8 | AUDIT | Ensure accounts without a valid login shell are locked | Warn Count"
      when: discovered_unlocked_nologin_accounts.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.4.2.8'

- name: "5.4.3.1 | PATCH | Ensure nologin is not listed in /etc/shells"
  when: ubtu20cis_rule_5_4_3_1
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_5.4.3.1
    - user
  ansible.builtin.lineinfile:
    path: /etc/shells
    regex: nologin\b
    state: absent

- name: "5.4.3.2 | PATCH | Ensure default user shell timeout is configured"
  when: ubtu20cis_rule_5_4_3_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.3.2
    - user
  ansible.builtin.blockinfile:
    create: true
    mode: 'u=rw,g=r,o=r'
    dest: "{{ item.dest }}"
    state: "{{ item.state }}"
    marker: "# {mark} ANSIBLE MANAGED"
    block: |
      # Set session timeout - CIS ID 5.4.3.2
      # only set TMOUT if it isn't set yet to avoid a shell error
      : ${TMOUT={{ ubtu20cis_shell_session_timeout.timeout }}}
      readonly TMOUT
      export TMOUT
  with_items:
    - {dest: "{{ ubtu20cis_shell_session_timeout.file }}", state: present}
    - {dest: /etc/profile, state: "{{ (ubtu20cis_shell_session_timeout.file == '/etc/profile') | ternary('present', 'absent') }}"}
    - {dest: /etc/bash.bashrc, state: present}

- name: "5.4.3.3 | PATCH | Ensure default user umask is configured"
  when: ubtu20cis_rule_5_4_3_3
  tags:
