- name: "5.4.1.4 | PATCH | Ensure strong password hashing algorithm is configured"
  when: ubtu20cis_rule_5_4_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.1.4
    - pamd
  block:
    - name: "5.4.1.4 | AUDIT | Ensure strong password hashing algorithm is configured | Confirm pam_unix.so"
      ansible.builtin.shell: grep -E '^\s*password\s+(\S+\s+)+pam_unix\.so\s+(\S+\s+)*(sha512|yescrypt)\s*(\S+\s*)*(\s+#.*)?$' /etc/pam.d/common-password  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_pam_unix_encrypt_state

    - name: "5.4.1.4 | PATCH | Ensure strong password hashing algorithm is configured | Set hashing if pam_unix.so exists"
      when: discovered_pam_unix_encrypt_state.stdout | length > 0
      community.general.pamd:
        name: common-password
        type: password
        control: '[success=1 default=ignore]'
        module_path: pam_unix.so
        module_arguments: "{{ ubtu20cis_passwd_hash_algo }}"
        state: args_present

    - name: "5.4.1.4 | PATCH | Ensure strong password hashing algorithm is configured | Set hashing if pam_unix.so does not exist"
      when: discovered_pam_unix_encrypt_state.stdout | length == 0
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        line: 'password        [success=1 default=ignore]      pam_unix.so {{ ubtu20cis_passwd_hash_algo }}'
        insertafter: '^# end of pam-auth-update config'

- name: "5.4.1.5 | PATCH | Ensure inactive password lock is configured"
  when: ubtu20cis_rule_5_4_1_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.1.5
    - user
    - login
  block:
    - name: "5.4.1.5 | AUDIT | Ensure inactive password lock is configured | Get current inactive period"
      ansible.builtin.shell: useradd -D | grep INACTIVE | cut -d= -f2  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_inactive_period

    - name: "5.4.1.5 | AUDIT | Ensure inactive password lock is configured | Get current users out of compliance"
      ansible.builtin.shell: awk -F":" '(/^[^:]+:[^!*]/ && ($7<0 || $7>30)){print $1}' //etc/shadow  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_inactive_users

    - name: "5.4.1.5 | PATCH | Ensure inactive password lock is configured | Set inactive period for new users"
      when: discovered_inactive_period.stdout != ubtu20cis_pass.inactive | string
      ansible.builtin.command: useradd -D -f {{ ubtu20cis_pass.inactive }}
      changed_when: true
      failed_when: false

    - name: "5.4.1.5 | PATCH | Ensure inactive password lock is configured | Set inactive period for existing users"
      when:
        - ubtu20cis_disruption_high
        - discovered_inactive_users.stdout | length > 0
      ansible.builtin.command: chage --inactive {{ ubtu20cis_pass.inactive }} {{ item }}
      with_items:
        - "{{ ubtu20cis_passwd | selectattr('uid', '>=', 1000) | map(attribute='id') | list | intersect(discovered_inactive_users.stdout_lines) | list }}"
      changed_when: true
      failed_when: false

- name: "5.4.1.6 | PATCH | Ensure all users last password change date is in the past"
  when: ubtu20cis_rule_5_4_1_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_5.4.1.6
    - user
    - login
  block:
    - name: "5.4.1.6 | AUDIT | Ensure all users last password change date is in the past | Get current date in Unix Time"
      ansible.builtin.shell: echo $(($(date --utc --date "$1" +%s)/86400))  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_current_time

    - name: "5.4.1.6 | AUDIT | Ensure all users last password change date is in the past | Get list of users with last changed PW date in future"
      ansible.builtin.shell: "cat /etc/shadow | awk -F: '{if($3>{{ discovered_current_time.stdout }})print$1}'"  # noqa: command-instead-of-shell
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_future_pw_users

    - name: "5.4.1.6 | PATCH | Ensure all users last password change date is in the past | Warn about users"
      when: discovered_future_pw_users.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! The following accounts have the last PW change date in the future"
          - "{{ discovered_future_pw_users.stdout_lines }}"

    - name: "5.4.1.6 | PATCH | Ensure all users last password change date is in the past | Warn Count"
      when: discovered_future_pw_users.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.4.1.6'

    - name: "5.4.1.6 | PATCH | Ensure all users last password change date is in the past | Lock accounts with future PW changed dates"
      when:
        - ubtu20cis_disruption_high
        - discovered_future_pw_users.stdout | length > 0
      ansible.builtin.command: passwd --expire {{ item }}
      with_items:
        - "{{ discovered_future_pw_users.stdout_lines }}"
      changed_when: true
      failed_when: false

