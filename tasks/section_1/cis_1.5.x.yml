---

- name: "1.5.1 | PATCH | Ensure address space layout randomization (ASLR) is enabled | Set active kernel parameter"
  when: ubtu20cis_rule_1_5_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.5.1
    - aslr
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: '2'

- name: "1.5.2 | PATCH | Ensure ptrace_scope is restricted | sysctl.conf"
  when: ubtu20cis_rule_1_5_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.5.2
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/60-kernel_sysctl.conf
    regexp: '^kernel.yama.ptrace_scope '
    line: kernel.yama.ptrace_scope=1
    create: true
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'

- name: "1.5.3 | PATCH | Ensure core dumps are restricted"
  when: ubtu20cis_rule_1_5_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.5.3
    - coredump
  block:
    - name: "1.5.3 | PATCH | Ensure core dumps are restricted | kernel sysctl"
      ansible.posix.sysctl:
        name: fs.suid_dumpable
        value: '0'
        state: present
        reload: true
        sysctl_set: true
        ignoreerrors: true

    - name: "1.5.3 | PATCH | Ensure core dumps are restricted | security limits"
      ansible.builtin.lineinfile:
        path: /etc/security/limits.d/99_zero_core.conf
        regexp: '^\* hard core'
        line: '* hard core 0'
        create: true
        owner: root
        group: root
        mode: 'u=rw,g=r,o=r'

    - name: "1.5.3 | PATCH | Ensure core dumps are restricted | sysctl.conf"
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^fs.suid_dumpable'
        line: fs.suid_dumpable=0
        owner: root
        group: root
        mode: 'u=rw,g=r,o=r'

    - name: "1.5.3 | PATCH | Ensure core dumps are restricted | coredump.conf"
      when: "'systemd-coredump' in ansible_facts.packages"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: true
        owner: root
        group: root
        mode: 'u=rw,g=r,o=r'
      loop:
        - {regexp: '^Storage', line: 'Storage=none'}
        - {regexp: '^ProcessSizeMax', line: 'ProcessSizeMax=0'}

- name: "1.5.4 | PATCH | Ensure prelink is not installed"
  when: ubtu20cis_rule_1_5_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.5.4
    - prelink
  block:
    - name: "1.5.4 | PATCH | Ensure prelink is not installed | Restore binaries to normal"
      ansible.builtin.command: prelink -ua
      changed_when: false
      failed_when: false

    - name: "1.5.4 | PATCH | Ensure prelink is not installed| Remove prelink package"
      ansible.builtin.package:
        name: prelink
        state: absent

- name: "1.5.5 | PATCH | Ensure Automatic Error Reporting is not enabled"
  when: ubtu20cis_rule_1_5_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.5.5
    - apport
  block:
    - name: "1.5.5 | PATCH | Ensure Automatic Error Reporting is not enabled | disable"
      ansible.builtin.lineinfile:
        path: /etc/default/apport
        regexp: ^enabled
        line: enabled=0
        create: true
        owner: root
        group: root
        mode: 'u=rw,g=r,o=r'

    - name: "1.5.5 | PATCH | Ensure Automatic Error Reporting is not enabled | stop service"
      when: "'apport' in ansible_facts.packages"
      ansible.builtin.systemd:
        name: apport
        state: stopped
        enabled: false

    - name: "1.5.5 | PATCH | Ensure Automatic Error Reporting is not enabled | remove package"
      when: "'apport' in ansible_facts.packages"
      ansible.builtin.package:
        name: apport
        state: absent
