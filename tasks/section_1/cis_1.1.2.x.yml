---

# /tmp partition

- name: "1.1.2.1.1 | AUDIT | Ensure /tmp is a separate partition"
  when:
    - required_mount not in prelim_mount_names
    - ubtu20cis_rule_1_1_2_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - mounts
    - rule_1.1.2.1.1
    - tmp
  vars:
    warn_control_id: '1.1.2.1.1'
    required_mount: '/tmp'
  block:
    - name: "1.1.2.1.1 | AUDIT | Ensure /tmp is a separate partition | Alert on findings"
      ansible.builtin.debug:
        msg: "Warning!! {{ required_mount }} doesn't exist. This is a manual task"

    - name: "1.1.2.1.1 | WARN | Ensure /tmp is a separate partition | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: |
    "1.1.2.1.2 | PATCH | Ensure nodev option set on /tmp partition | tmp_systemd"
    "1.1.2.1.3 | PATCH | Ensure nosuid option set on /tmp partition | tmp_systemd"
    "1.1.2.1.4 | PATCH | Ensure noexec option set on /tmp partition | tmp_systemd"
  when:
    - item.mount == "/tmp"
    - prelim_tmp_mnt_type == 'tmp_systemd'
    - ubtu20cis_rule_1_1_2_1_1 or ubtu20cis_rule_1_1_2_1_2 or ubtu20cis_rule_1_1_2_1_3 or ubtu20cis_rule_1_1_2_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.1.2.1.2
    - rule_1.1.2.1.3
    - rule_1.1.2.1.4
    - tmp
  ansible.builtin.template:
    src: etc/systemd/system/tmp.mount.j2
    dest: /etc/systemd/system/tmp.mount
    owner: root
    group: root
    mode: 'u-x,go-wx'
  with_items:
    - "{{ ansible_mounts }}"
  loop_control:
    label: "{{ item.device }}"
  notify: Remount tmp

- name: |
    "1.1.2.1.2 | PATCH | Ensure nodev option set on /tmp partition | fstab"
    "1.1.2.1.3 | PATCH | Ensure nosuid option set on /tmp partition | fstab"
    "1.1.2.1.4 | PATCH | Ensure noexec option set on /tmp partition | fstab"
  when:
    - item.mount == "/tmp"
    - prelim_tmp_mnt_type == 'fstab'
    - ubtu20cis_rule_1_1_2_1_1 or ubtu20cis_rule_1_1_2_1_2 or ubtu20cis_rule_1_1_2_1_3 or ubtu20cis_rule_1_1_2_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.1.2.1.2
    - rule_1.1.2.1.3
    - rule_1.1.2.1.4
    - tmp
  ansible.posix.mount:
    path: /tmp
    src: "{{ item.device }}"
    state: present
    fstype: "{{ item.fstype }}"
    opts: defaults,{% if ubtu20cis_rule_1_1_2_1_2 %}nodev,{% endif %}{% if ubtu20cis_rule_1_1_2_1_3 %}nosuid,{% endif %}{% if ubtu20cis_rule_1_1_2_1_4 %}noexec{% endif %}
  with_items:
    - "{{ ansible_mounts }}"
  loop_control:
    label: "{{ item.device }}"
  notify: Remount tmp

- name: |
    "1.1.2.2.1 | PATCH | Ensure /dev/shm is a separate partition"
    "1.1.2.2.2 | PATCH | Ensure nodev option set on /dev/shm partition"
    "1.1.2.2.3 | PATCH | Ensure noexec option set on /dev/shm partition"
    "1.1.2.2.4 | PATCH | Ensure nosuid option set on /dev/shm partition"
  when: ubtu20cis_rule_1_1_2_2_1 or ubtu20cis_rule_1_1_2_2_2 or ubtu20cis_rule_1_1_2_2_3 or ubtu20cis_rule_1_1_2_2_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.1.2.2.1
    - rule_1.1.2.2.2
    - rule_1.1.2.2.3
    - rule_1.1.2.2.4
    - dev_shm
  ansible.posix.mount:
    path: /dev/shm
    src: /dev/shm
    fstype: tmpfs
    state: present
    opts: "defaults,{% if ubtu20cis_rule_1_1_2_2_1 or ubtu20cis_rule_1_1_2_2_2 %}nodev,{% endif %}{% if ubtu20cis_rule_1_1_2_2_3 %}noexec,{% endif %}{% if ubtu20cis_rule_1_1_2_2_4 %}nosuid{% endif %}"
  notify: Remount dev_shm

