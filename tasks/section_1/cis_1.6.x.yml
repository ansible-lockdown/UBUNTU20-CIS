    owner: root
    group: root
    mode: 'u-x,go-wx'

- name: "1.6.4 | PATCH | Ensure access to /etc/motd is configured"
  when: ubtu20cis_rule_1_6_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.6.4
    - permissions
    - motd
  ansible.builtin.file:
    path: /etc/motd
    owner: root
    group: root
    mode: 'u-x,go-wx'

