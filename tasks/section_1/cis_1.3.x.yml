---

- name: "1.3.1.1 | PATCH | Ensure latest versions of the apparmor packages are installed"
  when: ubtu20cis_rule_1_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.3.1.1
    - apparmor
  ansible.builtin.package:
    name: ['apparmor', 'apparmor-utils']
    state: present

- name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled in the bootloader configuration"
  when: ubtu20cis_rule_1_3_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.3.1.2
    - apparmor
  # Any unconfined processes may need to have a profile created or activated for them and then be restarted So manual task
  block:
    - name: "1.3.1.2 | AUDIT | Ensure AppArmor is enabled in the bootloader configuration | Get current settings"
      ansible.builtin.shell: grep "GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"'
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_apparmor_cmdline_settings

    - name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled in the bootloader configuration | Set apparmor settings if none exist"
      when:
        - "'apparmor' not in discovered_apparmor_cmdline_settings.stdout"
        - "'security' not in discovered_apparmor_cmdline_settings.stdout"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX'
        line: 'GRUB_CMDLINE_LINUX="apparmor=1 security=apparmor {{ discovered_apparmor_cmdline_settings.stdout }}"'
        insertafter: '^GRUB_'
      notify: Grub update

    - name: "1.3.1.2 | PATCH | Ensure AppArmor is enabled in the bootloader configuration | Set apparmor settings if none exist | Replace apparmor settings when exists"
      when:
        - "'apparmor' in discovered_apparmor_cmdline_settings.stdout"
        - "'security' in discovered_apparmor_cmdline_settings.stdout"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      with_items:
        - {regexp: 'apparmor=[^\s"]+', replace: 'apparmor=1'}
        - {regexp: 'security=[^\s"]+', replace: 'security=apparmor'}
      notify: Grub update

- name: "1.3.1.3 | PATCH | Ensure all AppArmor Profiles are not disabled"
  when: ubtu20cis_rule_1_3_1_3
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - rule_1.3.1.3
    - apparmor
  # These tasks can be forced to run but some apps may not have profiles associated so this will need to be manual task
  block:
    - name: "1.3.1.3 | AUDIT | Ensure all AppArmor Profiles are not disabled | capture state"
      ansible.builtin.shell: apparmor_status | grep "processes.*unconfined" | awk '{ print $1 }'
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_apparmor_unconfined

    - name: "1.3.1.3 | AUDIT | Ensure all AppArmor Profiles are not disabled | Alert on findings"
      when: discovered_apparmor_unconfined.stdout != '0'
      ansible.builtin.debug:
        msg: "Warning!! AppArmor mode needs to be confirmed | Any unconfined processes may need to have a profile created"

    - name: "1.3.1.3 | AUDIT | Ensure all AppArmor Profiles are not disabled | Warn Count"
      when: discovered_apparmor_unconfined.stdout != '0'
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.3.1.3'

- name: "1.3.1.4 | PATCH | Ensure all AppArmor Profiles are enforcing"
  when: ubtu20cis_rule_1_3_1_4
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_1.3.1.4
    - apparmor
  block:
    - name: "1.3.1.4 | AUDIT | Ensure all AppArmor Profiles are enforcing | capture state"
      ansible.builtin.shell: apparmor_status | grep -E "processes.*complain" | awk '{ print $1 }'
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_apparmor_enforced

    - name: "1.3.1.4 | AUDIT | Ensure all AppArmor Profiles are enforcing | Alert on findings"
      when: discovered_apparmor_enforced.stdout != '0'
      ansible.builtin.debug:
        msg: "Warning!! AppArmor mode is not in enforcing | Any unconfined processes may need to have a profile created"

    - name: "1.3.1.4 | AUDIT | Ensure all AppArmor Profiles are enforcing | Warn Count"
      when: discovered_apparmor_enforced.stdout != '0'
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.3.1.4'
