---

- name: "1.7.1 | PATCH | Ensure GNOME Display Manager is removed"
  when:
    - ubtu20cis_rule_1_7_1
    - not ubtu20cis_desktop_required
    - ubtu20cis_disruption_high
    - "'gdm3' in ansible_facts.packages"
  tags:
    - level2-server
    - manual
    - patch
    - rule_1.7.1
    - gnome
  ansible.builtin.package:
    name: gdm3
    state: absent

- name: "1.7.2 | PATCH | Ensure GDM login banner is configured"
  when:
    - ubtu20cis_rule_1_7_2
    - ubtu20cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.7.2
    - gnome
  ansible.builtin.lineinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: "{{ item.insertafter }}"
    create: true
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'
  with_items:
    - {regexp: '\[org\/gnome\/login-screen\]', line: '[org/gnome/login-screen]', insertafter: EOF}
    - {regexp: 'banner-message-enable', line: 'banner-message-enable=true', insertafter: '\[org\/gnome\/login-screen\]'}
    - {regexp: 'banner-message-text', line: "banner-message-text='{{ ubtu20cis_warning_banner | regex_replace('\n', ' ') | trim }}'", insertafter: 'banner-message-enable'}
  notify: update dconf

- name: "1.7.3 | PATCH | Ensure disable-user-list is enabled"
  when:
    - ubtu20cis_rule_1_7_3
    - ubtu20cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.7.3
    - gnome
  ansible.builtin.lineinfile:
    path: /etc/gdm3/greeter.dconf-default
    regexp: '^disable-user-list='
    line: 'disable-user-list=true'
    insertafter: 'banner-message-text='
    create: true
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'
  notify: update dconf

- name: "1.7.4 | PATCH | Ensure GDM screen locks when the user is idle"
  when:
    - ubtu20cis_rule_1_7_4
    - ubtu20cis_desktop_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.7.4
    - gnome
  block:
    - name: "1.7.4 | PATCH | Ensure GDM screen locks when the user is idle | session profile"
      ansible.builtin.lineinfile:
        path: /etc/dconf/profile/session
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.after | default(omit) }}"
      loop:
        - "{ regexp: 'user-db: user', line: 'user' }"
        - "{ regexp: 'system-db: {{ ubtu20cis_dconf_db_name }}'', after: '^user-db.*' }"

    - name: "1.7.4 | PATCH | Ensure GDM screen locks when the user is idle | make directory"
      ansible.builtin.file:
        path: "/etc/dconf/db/{{ ubtu20cis_dconf_db_name }}.d"
        owner: root
        group: root
        mode: 'u=rwx,g=rx,o=rx'
        state: directory
      notify: update dconf

    - name: "1.7.4 | PATCH | Ensure GDM screen locks when the user is idle | session script"
      ansible.builtin.template:
        src: etc/dconf/db/00-screensaver.j2
        dest: "/etc/dconf/db/{{ ubtu20cis_dconf_db_name }}.d/00-screensaver"
        owner: root
        group: root
        mode: 'u=rw,g=r,o=r'
      notify: update dconf

