- name: "1.7.10 | PATCH | Ensure XDCMP is not enabled"
  when: ubtu20cis_rule_1_7_10
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.7.10
    - gnome
    - xdcmp
  ansible.builtin.lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: '^Enable.*=.*true'
    state: absent
