- name: "1.1.1.9 | PATCH | Ensure usb-storage kernel module is not available"
  when:
    - ubtu20cis_rule_1_1_1_9
    - not ubtu20cis_allow_usb_storage
  tags:
    - level1-server
    - level2-workstation
    - automated
    - patch
    - rule_1.1.1.9
    - usb_storage
  block:
    - name: "1.1.1.9 | PATCH | Ensure usb-storage kernel module is not available | Set modprobe config"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/usb_storage.conf
        regexp: '^install usb-storage'
        line: 'install usb-storage /bin/true'
        create: true
        mode: 'go-rwx'

    - name: "1.1.1.9 | PATCH | Ensure usb-storage kernel module is not available | Remove usb-storage module"
      when: ansible_connection not in ['docker', 'community.docker.docker']
      community.general.modprobe:
        name: usb-storage
        state: absent

    - name: "1.1.1.9 | PATCH | Ensure usb-storage kernel module is not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: '^blacklist usb-storage'
        line: 'blacklist usb-storage'
        create: true
        mode: 'go-rwx'

- name: "1.1.1.10 | PATCH | Ensure unused filesystems kernel modules are not available"
  when: ubtu20cis_rule_1_1_1_10
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_1.1.1.10
  block:
    - name: "1.1.1.10 | PATCH | Ensure unused filesystems kernel modules are not available | Add discovery script"
      ansible.builtin.copy:
        src: fs_with_cves.sh
        dest: /var/fs_with_cves.sh
        owner: root
        group: root
        mode: 'u+x,go-wx'

    - name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available | Run discovery script"
      ansible.builtin.command: /var/fs_with_cves.sh
      changed_when: false
      failed_when: discovered_fs_modules_loaded.rc not in [ 0, 99 ]
      register: discovered_fs_modules_loaded

    - name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available | Alert on findings"
      when: discovered_fs_modules_loaded.stdout | length > 0
      ansible.builtin.debug:
        msg: "{{ ['Warning!! Discovered loaded Filesystem modules that need attention'] + discovered_fs_modules_loaded.stdout_lines }}"

    - name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available | Warn Count"
      when: discovered_fs_modules_loaded.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.1.1.10'
