---

- name: |
    "6.3.4.1 | PATCH | Ensure audit log files are mode 0640 or less permissive"
    "6.3.4.2 | PATCH | Ensure only authorized users own audit log files"
    "6.3.4.3 | PATCH | Ensure only authorized groups are assigned ownership of audit log files"
  when: ubtu20cis_rule_6_3_4_1 or ubtu20cis_rule_6_3_4_2 or ubtu20cis_rule_6_3_4_3
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.1
    - rule_6.3.4.2
    - rule_6.3.4.3
  block:
    - name: "6.3.4.1 | AUDIT | Ensure audit log files are mode 0640 or less permissive | discover file"
      ansible.builtin.shell: grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'
      changed_when: false
      check_mode: false
      register: discovered_audit_logfile

    - name: "6.3.4.1 | AUDIT | Ensure audit log files are mode 0640 or less permissive | stat file"
      ansible.builtin.stat:
        path: "{{ discovered_audit_logfile.stdout }}"
      changed_when: false
      register: discovered_auditd_logfile

    - name: |
        "6.3.4.1 | PATCH | Ensure audit log files are mode 0640 or less permissive"
        "6.3.4.2 | PATCH | Ensure only authorized users own audit log files"
        "6.3.4.3 | PATCH | Ensure only authorized groups are assigned ownership of audit log files"
      ansible.builtin.file:
        path: "{{ discovered_audit_logfile.stdout }}"
        mode: "{% if discovered_auditd_logfile.stat.mode > '0640' %}u=rw,g=r,o={% endif %}"
        owner: root
        group: root

- name: "6.3.4.4 | PATCH | Ensure the audit log directory is 0750 or more restrictive"
  when: ubtu20cis_rule_6_3_4_4
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.4
  block:
    - name: "6.3.4.4 | AUDIT | Ensure the audit log directory is 0750 or more restrictive | get current permissions"
      ansible.builtin.stat:
        path: "{{ discovered_audit_logfile.stdout | dirname }}"
      register: discovered_auditlog_dir

    - name: "6.3.4.4 | PATCH | Ensure the audit log directory is 0750 or more restrictive | set"
      when: not discovered_auditlog_dir.stat.mode is match('07(0|5)0')
      ansible.builtin.file:
        path: "{{ discovered_audit_logfile.stdout | dirname }}"
        state: directory
        mode: 'u=rwx,g=rx,o='

- name: "6.3.4.5 | PATCH | Ensure audit configuration files are 640 or more restrictive"
  when:
    - item.mode > '0640'
    - ubtu20cis_rule_6_3_4_5
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.5
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: 'u=rw,g=r,o='
  loop: "{{ prelim_auditd_conf_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.3.4.6 | PATCH | Ensure audit configuration files are owned by root"
  when: ubtu20cis_rule_6_3_4_6
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.6
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
  loop: "{{ prelim_auditd_conf_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.3.4.7 | PATCH | Ensure audit configuration files belong to group root"
  when: ubtu20cis_rule_6_3_4_7
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.7
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: root
  loop: "{{ prelim_auditd_conf_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: "6.3.4.8 | PATCH | Ensure audit tools are 755 or more restrictive"
  when: ubtu20cis_rule_6_3_4_8
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.8
  block:
    - name: "6.3.4.8 | AUDIT | Get audit binary file stat | get current mode"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/augenrules
      register: discovered_audit_bins

    - name: "6.3.4.8 | PATCH | Ensure audit tools are 755 or more restrictive | set if required"
      when: not item.stat.mode is match('07(0|5)0')
      ansible.builtin.file:
        path: "{{ item.item }}"
        mode: 'u=rwx,g=rx,o='
      loop: "{{ discovered_audit_bins.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: "6.3.4.9 | PATCH | Ensure audit tools are owned by root"
  when: ubtu20cis_rule_6_3_4_9
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.9
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
  loop:
    - /sbin/auditctl
    - /sbin/aureport
    - /sbin/ausearch
    - /sbin/autrace
    - /sbin/auditd
    - /sbin/augenrules

- name: "6.3.4.10 | PATCH | Ensure audit tools belong to group root"
  when: ubtu20cis_rule_6_3_4_10
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - auditd
    - rule_6.3.4.10
  ansible.builtin.file:
    path: "{{ item }}"
    group: root
  loop:
    - /sbin/auditctl
    - /sbin/aureport
    - /sbin/ausearch
    - /sbin/autrace
    - /sbin/auditd
    - /sbin/augenrules
