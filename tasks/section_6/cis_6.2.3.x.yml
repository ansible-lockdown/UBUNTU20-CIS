---

- name: "6.2.3.1 | PATCH | Ensure rsyslog service is enabled and active"
  when: ubtu20cis_rule_6_2_3_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.3.1
    - rsyslog
  ansible.builtin.service:
    name: rsyslog
    enabled: true

- name: "6.2.3.2 | PATCH | Ensure rsyslog is installed"
  when: ubtu20cis_rule_6_2_3_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.3.2
    - rsyslog
    - apt
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: "6.2.3.3 | PATCH | Ensure journald is configured to send logs to rsyslog"
  when: ubtu20cis_rule_6_2_3_3
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - journald
    - rule_6.2.3.3
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: ^ForwardToSyslog=
    line: ForwardToSyslog=yes
  notify: Restart syslog service

- name: "6.2.3.4 | PATCH | Ensure rsyslog log file creation mode is configured"
  when: ubtu20cis_rule_6_2_3_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.3.4
    - rsyslog
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\$FileCreateMode|^#\$FileCreateMode'
    line: '$FileCreateMode 0640'
  notify: Restart syslog service

- name: "6.2.3.5 | PATCH | Ensure rsyslog logging is configured"
  when: ubtu20cis_rule_6_2_3_5
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - rule_6.2.3.5
    - rsyslog
  block:
    - name: "6.2.3.5 | AUDIT | Ensure rsyslog logging is configured | Find configuration file"
      ansible.builtin.shell: grep -r "*.emerg" /etc/* | cut -f1 -d":"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_rsyslog_config_path

    - name: "6.2.3.5 | AUDIT | Ensure rsyslog logging is configured | Gather rsyslog current config"
      ansible.builtin.command: "cat {{ discovered_rsyslog_config_path.stdout }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_rsyslog_config

    - name: "6.2.3.5 | AUDIT | Ensure rsyslog logging is configured | Message out config"
      when: not ubtu20cis_rsyslog_ansible_managed
      ansible.builtin.debug:
        msg:
          - "Warning!! Below is the current logging configurations for rsyslog, please review"
          - "{{ discovered_rsyslog_config.stdout_lines }}"

    - name: "6.2.3.5 | PATCH | Ensure rsyslog logging is configured | Automated rsyslog configuration"
      when: ubtu20cis_rsyslog_ansible_managed
      ansible.builtin.lineinfile:
        path: "{{ discovered_rsyslog_config_path.stdout }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: "{{ item.insertafter }}"
        create: true
        mode: 'u=rw,g=r,o=r'
      with_items:
        - {regexp: '^\*.emerg', line: '*.emerg                         :omusrmsg:*', insertafter: '^# Emergencies are sent to everybody logged in'}
        - {regexp: '^auth,authpriv.\*', line: 'auth,authpriv.*                  /var/log/auth.log', insertafter: '^# First some standard log files.  Log by facility'}
        - {regexp: '^mail.\*|^#mail.\*', line: 'mail.*                          -/var/log/mail', insertafter: '^# First some standard log files'}
        - {regexp: '^mail.info|^#mail.info', line: 'mail.info                      -/var/log/mail.info', insertafter: '^# Logging for the mail system'}
        - {regexp: '^mail.warn|^#mail.warn', line: 'mail.warn                      -/var/log/mail.warn', insertafter: '^# Logging for the mail system.'}
        - {regexp: '^mail.err|^#mail.err', line: 'mail.err                        /var/log/mail.err', insertafter: '^# Logging for the mail system.'}
        - {regexp: '^cron.\*|^#cron.\*', line: 'cron.*                     /var/log/cron', insertafter: '^# First some standard log files'}
        - {regexp: '^\*.=warning;\*.=err|^#\*.=warning;\*.=err', line: '*.=warning;*.=err               -/var/log/warn', insertafter: '^# First some standard log files'}
        - {regexp: '^\*.crit|^#\*.crit', line: '*.crit                           /var/log/warn', insertafter: '^# First some standard log files'}
        - {regexp: '^\*.\*;mail.none;news.none|^#\*.\*;mail.none;news.none', line: '*.*;mail.none;news.none         -/var/log/messages', insertafter: '^# First some standard log files'}
        - {regexp: '^local0,local1.\*|^#local0,local1.\*', line: 'local0,local1.*                 -/var/log/localmessages', insertafter: '^# First some standard log files'}
        - {regexp: '^local2,local3.\*|^#local2,local3.\*', line: 'local2,local3.*                 -/var/log/localmessages', insertafter: '^# First some standard log files'}
        - {regexp: '^local4,local5.\*|^#local4,local5.\*', line: 'local4,local5.*                 -/var/log/localmessages', insertafter: '^# First some standard log files'}
        - {regexp: '^local6,local7.\*|^#local6,local7.\*', line: 'local6,local7.*                 -/var/log/localmessages', insertafter: '^# First some standard log files'}
      loop_control:
        label: "{{ item.line }}"
      notify: Restart syslog service

    - name: "6.2.3.5 | AUDIT | Ensure rsyslog logging is configured | Warn Count"
      when: not ubtu20cis_rsyslog_ansible_managed
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '6.2.3.5'

- name: "6.2.3.6 | PATCH | Ensure rsyslog is configured to send logs to a remote log host"
  when: ubtu20cis_rule_6_2_3_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.3.6
    - rsyslog
  ansible.builtin.blockinfile:
    path: /etc/rsyslog.conf
    block: |
      ##Enable sending of logs over TCP add the following line:
      *.* @@{{ ubtu20cis_remote_log_server }}
    insertafter: EOF

- name: "6.2.3.7 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When not a log host"
  when:
    - not ubtu20cis_system_is_log_server
    - ubtu20cis_rule_6_2_3_7
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - rule_6.2.3.7
    - rsyslog
  ansible.builtin.replace:
    path: /etc/rsyslog.conf
    regexp: '({{ item }})'
    replace: '#\1'
  with_items:
    - '^(\$ModLoad)'
    - '^(\$InputTCPServerRun)'
    - '^(module\(load="itcmp"\))'
    - '^(input\(type="imtcp" port="\d{1,5}"\))'
  notify: Restart syslog service

- name: "6.2.3.8 | PATCH | Ensure logrotate is configured"
  when: ubtu20cis_rule_6_2_3_8
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.3.8
  block:
    - name: "6.2.3.8 | AUDIT | Ensure logrotate is configured | Get logrotate config files"
      ansible.builtin.find:
        paths: /etc/logrotate.d/
      register: discovered_logrotate_conf

    - name: "6.2.3.8 | PATCH | Ensure logrotate is configured | Set rotation in drop-in files"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ ubtu20cis_logrotate }}"
      loop: "{{ discovered_logrotate_conf.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: "6.2.3.8 | PATCH | Ensure logrotate is configured | Set rotation in logrotate.conf"
      ansible.builtin.replace:
        path: /etc/logrotate.conf
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ ubtu20cis_logrotate }}"
