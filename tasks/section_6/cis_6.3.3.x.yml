  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_6.3.3.1
    - auditd
  ansible.builtin.template:
    src: audit/ubtu20cis_6_3_3_1_scope.rules.j2
    dest: /etc/audit/rules.d/50-scope.rules
    owner: root
    group: root
    mode: 'go-rwx'
  notify: Restart auditd

