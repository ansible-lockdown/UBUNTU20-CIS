- name: "6.3.3.6 | PATCH | Ensure use of privileged commands are collected"
  when: ubtu20cis_rule_6_3_3_6
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_6.3.3.6
    - auditd
  block:
    - name: "6.3.3.6 | AUDIT | Ensure use of privileged commands are collected | Get list of privileged programs"
      ansible.builtin.shell: for i in  $(findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv "noexec|nosuid" | awk '{print $1}'); do find $i -xdev -type f -perm -4000 -o -type f -perm -2000 2>/dev/null; done
      changed_when: false
      check_mode: false
      register: discovered_priv_procs

    - name: "6.3.3.6 | PATCH | Ensure use of privileged commands are collected | Set privileged rules"
      ansible.builtin.template:
        src: audit/ubtu20cis_6_3_3_6_privileged.rules.j2
        dest: /etc/audit/rules.d/50-privileged.rules
        owner: root
        group: root
        mode: 'go-rwx'
      notify: Restart auditd

