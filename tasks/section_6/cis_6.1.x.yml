---

- name: "6.1.1 | PATCH | Ensure AIDE is installed"
  when:
    - ubtu20cis_rule_6_1_1
    - ubtu20cis_config_aide
    - "'aide' not in ansible_facts.packages or 'aide-common' not in ansible_facts.packages"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.1.1
    - aide
  block:
    - name: "6.1.1 | PATCH | Ensure AIDE is installed"
      ansible.builtin.package:
        name: ['aide', 'aide-common']
        state: present
        update_cache: true

    - name: "6.1.1 | PATCH | Ensure AIDE is installed | Recapture packages"
      ansible.builtin.package_facts:
        manager: auto

    - name: "6.1.1 | PATCH | Ensure AIDE is installed | Configure AIDE"
      when: not ansible_check_mode
      ansible.builtin.shell: aide init && mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
      async: 45
      poll: 0
      args:
        creates: /var/lib/aide/aide.db
      changed_when: false
      failed_when: false

- name: "6.1.2 | PATCH | Ensure filesystem integrity is regularly checked"
  when:
    - ubtu20cis_config_aide
    - ubtu20cis_rule_6_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.1.2
    - cron
  ansible.builtin.cron:
    name: Run AIDE integrity check
    cron_file: "{{ ubtu20cis_aide_cron['cron_file'] }}"
    user: "{{ ubtu20cis_aide_cron['cron_user'] }}"
    minute: "{{ ubtu20cis_aide_cron['aide_minute'] | default('0') }}"
    hour: "{{ ubtu20cis_aide_cron['aide_hour'] | default('5') }}"
    day: "{{ ubtu20cis_aide_cron['aide_day'] | default('*') }}"
    month: "{{ ubtu20cis_aide_cron['aide_month'] | default('*') }}"
    weekday: "{{ ubtu20cis_aide_cron['aide_weekday'] | default('*') }}"
    job: "{{ ubtu20cis_aide_cron['aide_job'] }}"

- name: "6.1.3 | PATCH | Ensure cryptographic mechanisms are used to protect the integrity of audit tools"
  when: ubtu20cis_rule_6_1_3
  tags:
    - level2-server
    - level2-workstation
    - automated
    - patch
    - rule_6.1.3
    - auditd
  ansible.builtin.lineinfile:
    path: /etc/aide/aide.conf
    regexp: "{{ item }}"
    line: "{{ item }}"
  loop:
    - '# Audit tools'
    - /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
    - /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
    - /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
    - /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
    - /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
    - /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
