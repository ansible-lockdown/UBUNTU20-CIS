---

- name: "6.2.1.1 | PATCH | Ensure journald service is enabled"
  when: ubtu20cis_rule_6_2_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.1.1
    - journald
  block:
    - name: "6.2.1.1 | Ensure journald service is enabled | capture status"
      ansible.builtin.command: systemctl is-enabled systemd-journald.service  # noqa: command-instead-of-module
      changed_when: false
      failed_when: ubtu20cis_6_2_1_1_journald_enabled.rc not in [ 0, 1, 2 ]
      check_mode: false
      register: ubtu20cis_6_2_1_1_journald_enabled

    - name: "6.2.1.1 | Ensure journald service is enabled | warn count if not as expected"
      when: "'static' not in ubtu20cis_6_2_1_1_journald_enabled.stdout"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '6.2.1.1'

- name: "6.2.1.2 | PATCH | Ensure journald default file permissions configured"
  when: ubtu20cis_rule_6_2_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.1.2
    - journald
  block:
    - name: "6.2.1.2 | AUDIT | Ensure journald default file permissions configured | check for override file"
      ansible.builtin.stat:
        path: /etc/tmpfiles.d/systemd.conf
      register: ubtu20cis_6_2_1_2_tmpfile

    - name: "6.2.1.2 | AUDIT | Ensure journald default file permissions configured | update settings if override exists"
      when: ubtu20cis_6_2_1_2_tmpfile.stat.exists
      ansible.builtin.lineinfile:
        path: /etc/tmpfiles.d/systemd.conf
        regexp: "{{ item.line }}"
        line: "{{ item.line }}"
        backrefs: true
      loop:
        - {regexp: '.*system.journal.*(:r(w|-)(x|-))(,|$)', line: 'a+ /var/log/journal/%m/system.journal - - - - group:adm:r--'}
        - {regexp: '.*\/var\/log\/journal\/\%m\s.*(:r(w|-)(x|-))(,|$)', line: 'a+ /var/log/journal/%m - - - - d:group:adm:r-x,group:adm:r-x'}
        - {regexp: '.*\/var\/log\/journal\s.*(:r(w|-)(x|-))(,|$)', line: 'a+ /var/log/journal    - - - - d:group::r-x,d:group:adm:r-x,group::r-x,group:adm:r-x'}

- name: "6.2.1.3 | PATCH | Ensure journald log rotation is configured per site policy"
  when: ubtu20cis_rule_6_2_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.1.3
    - journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - {regexp: 'SystemMaxUse=', line: "SystemMaxUse={{ ubtu20cis_journald_log_rotate.systemmaxuse }}"}
    - {regexp: 'SystemKeepFree=', line: "SystemKeepFree={{ ubtu20cis_journald_log_rotate.systemkeepfree }}"}
    - {regexp: 'RunTimeMaxUse=', line: "RunTimeMaxUse={{ ubtu20cis_journald_log_rotate.runtimemaxuse }}"}
    - {regexp: 'RuntimeKeepFree=', line: "RuntimeKeepFree={{ ubtu20cis_journald_log_rotate.runtimekeepfree }}"}
    - {regexp: 'MaxFileSec=', line: "MaxFileSec={{ ubtu20cis_journald_log_rotate.maxfilesec }}"}

- name: "6.2.2.1.1 | PATCH | Ensure systemd-journal-remote is installed"
  when: ubtu20cis_rule_6_2_2_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.1.1
    - journald
  ansible.builtin.package:
    name: systemd-journal-remote
    state: present

- name: "6.2.2.1.2 | PATCH | Ensure systemd-journal-remote is configured"
  when: ubtu20cis_rule_6_2_2_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.1.2
    - journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journal-upload.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: "{{ item.after | default(omit) }}"
  loop:
    - {regexp: 'URL=', line: 'URL={{ ubtu20cis_journald_upload.remote_url }}'}
    - {regexp: 'ServerKeyFile=', line: 'ServerKeyFile={{ ubtu20cis_journal_upload.serverkeyfile }}'}
    - {regexp: 'ServerCertificateFile=', line: 'ServerKeyFile={{ ubtu20cis_journal_upload.servercertfile }}'}
    - {regexp: 'TrustedCertificateFile=', line: 'ServerKeyFile={{ ubtu20cis_journal_upload.trustfile }}'}
  notify: restart journal-upload

- name: "6.2.2.1.3 | PATCH | Ensure systemd-journal-remote is enabled"
  when: ubtu20cis_rule_6_2_2_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.1.3
    - journald
  ansible.builtin.systemd:
    name: systemd-journal-upload.service
    state: started
    enabled: true

- name: "6.2.2.1.4 | PATCH | Ensure journald is not configured to receive logs from a remote client"
  when:
    - ubtu20cis_rule_6_2_2_1_4
    - not journald_log_server
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.1.4
    - journald
  ansible.builtin.systemd:
    name: systemd-journal-remote
    state: stopped
    enabled: false

- name: "6.2.2.2 | PATCH | Ensure journald is not configured to send logs to rsyslog"
  when: ubtu20cis_rule_6_2_2_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.2
    - journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^ForwardToSyslog|^#ForwardToSyslog'
    line: 'ForwardToSyslog=no'
    insertafter: '\[Journal\]'

- name: "6.2.2.3 | PATCH | Ensure journald is configured to compress large log files"
  when: ubtu20cis_rule_6_2_2_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.3
    - journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^Compress|^#Compress'
    line: 'Compress=yes'
    insertafter: '\[Journal\]'

- name: "6.2.2.4 | PATCH | Ensure journald is configured to write logfiles to persistent disk"
  when: ubtu20cis_rule_6_2_2_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_6.2.2.4
    - journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^Storage|^#Storage'
    line: 'Storage=persistent'
    insertafter: '\[Journal\]'

- name: "6.2.4.1 | PATCH | Ensure permissions on all logfiles are configured"
  when: ubtu20cis_rule_6_2_4_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - logfiles
    - rule_6.2.4.1
  block:
    - name: "6.2.4.1 | AUDIT | Ensure permissions on all logfiles are configured | find files"
      ansible.builtin.find:
        paths: "/var/log"
        file_type: file
        recurse: true
      register: logfiles

    - name: "6.2.4.1 | PATCH | Ensure permissions on all logfiles are configured | change permissions"
      when:
        - item.path != "/var/log/btmp"
        - item.path != "/var/log/utmp"
        - item.path != "/var/log/wtmp"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: 'u=rw,g=r,o='
      loop: "{{ logfiles.files }}"
      loop_control:
        label: "{{ item.path }}"
