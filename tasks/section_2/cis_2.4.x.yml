  ansible.builtin.file:
    path: /etc/cron.d
    owner: root
    group: root
    state: touch
    mode: 'u+rwx,go-rwx'

- name: "2.4.1.9 | PATCH | Ensure access to crontab is configured"
  when: ubtu20cis_rule_2_4_1_9
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.9
    - cron
  block:
    - name: "2.4.1.9 | PATCH | Ensure access to crontab is configured | Remove cron.deny"
      ansible.builtin.file:
        path: /etc/cron.deny
        state: absent

    - name: "2.4.1.9 | PATCH | Ensure access to crontab is configured | Create cron.allow"
      ansible.builtin.copy:
        content: ""
        dest: /etc/cron.allow
        force: false
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'

- name: "2.4.2.1 | PATCH | Ensure access to at is configured"
  when: ubtu20cis_rule_2_4_2_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.2.1
    - cron
  block:
    - name: "2.4.2.1 | PATCH | Ensure access to at is configured | Remove at.deny"
      ansible.builtin.file:
        path: /etc/at.deny
        state: absent

    - name: "2.4.2.1 | PATCH | Ensure access to at is configured | Create at.allow"
      ansible.builtin.copy:
        content: ""
        dest: /etc/at.allow
        force: false
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'
