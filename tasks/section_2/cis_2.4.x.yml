---

- name: "2.4.1.1 | PATCH | Ensure cron daemon is enabled and active"
  when: ubtu20cis_rule_2_4_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.1
    - cron
  ansible.builtin.service:
    name: cron
    state: started
    enabled: true

- name: "2.4.1.2 | PATCH | Ensure permissions on /etc/crontab are configured"
  when: ubtu20cis_rule_2_4_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.2
    - cron
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    mode: 'u=rw,g=,o='

- name: "2.4.1.3 | PATCH | Ensure permissions on /etc/cron.hourly are configured"
  when: ubtu20cis_rule_2_4_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.3
    - cron
  ansible.builtin.file:
    path: /etc/cron.hourly
    owner: root
    group: root
    mode: 'u=rwx,g=,o='

- name: "2.4.1.4 | PATCH | Ensure permissions on /etc/cron.daily are configured"
  when: ubtu20cis_rule_2_4_1_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.4
    - cron
  ansible.builtin.file:
    path: /etc/cron.daily
    owner: root
    group: root
    mode: 'u=rwx,g=,o='

- name: "2.4.1.5 | PATCH | Ensure permissions on /etc/cron.weekly are configured"
  when: ubtu20cis_rule_2_4_1_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.5
    - cron
  ansible.builtin.file:
    path: /etc/cron.weekly
    owner: root
    group: root
    mode: 'u=rwx,g=,o='

- name: "2.4.1.6 | PATCH | Ensure permissions on /etc/cron.monthly are configured"
  when: ubtu20cis_rule_2_4_1_6
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.6
    - cron
  ansible.builtin.file:
    path: /etc/cron.monthly
    owner: root
    group: root
    mode: 'u=rwx,g=,o='

- name: "2.4.1.7 | PATCH | Ensure permissions on /etc/cron.yearly are configured"
  when: ubtu20cis_rule_2_4_1_7
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.7
    - cron
  block:
    - name: "2.4.1.7 | AUDIT | Ensure permissions on /etc/cron.yearly are configured | check status"
      ansible.builtin.debug:
        msg: "This control requires manual remediation"

    - name: "2.4.1.7 | AUDIT | Ensure permissions on /etc/cron.yearly are configured | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.4.1.7'

- name: "2.4.1.8 | PATCH | Ensure permissions on /etc/cron.d are configured"
  when: ubtu20cis_rule_2_4_1_8
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.8
    - cron
  ansible.builtin.file:
    path: /etc/cron.d
    owner: root
    group: root
    mode: 'u=rwx,g=,o='

- name: "2.4.1.9 | PATCH | Ensure crontab is restricted to authorized users"
  when: ubtu20cis_rule_2_4_1_9
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.9
    - cron
  block:
    - name: "2.4.1.9 | PATCH | Ensure crontab is restricted to authorized users | Remove cron.deny"
      ansible.builtin.file:
        path: /etc/cron.deny
        state: absent

    - name: "2.4.1.9 | PATCH | Ensure crontab is restricted to authorized users | Create cron.allow"
      ansible.builtin.copy:
        content: ""
        dest: /etc/cron.allow
        force: false
        owner: root
        group: crontab
        mode: 'u=rw,g=r,o='

- name: "2.4.2.1 | PATCH | Ensure at is restricted to authorized users"
  when: ubtu20cis_rule_2_4_2_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.2.1
    - cron
  block:
    - name: "2.4.2.1 | PATCH | Ensure at is restricted to authorized users | Remove at.deny"
      ansible.builtin.file:
        path: /etc/at.deny
        state: absent

    - name: "2.4.2.1 | PATCH | Ensure at is restricted to authorized users | Create at.allow"
      ansible.builtin.copy:
        content: ""
        dest: /etc/at.allow
        force: false
        owner: root
        group: root
        mode: 'u=rw,g=r,o='
