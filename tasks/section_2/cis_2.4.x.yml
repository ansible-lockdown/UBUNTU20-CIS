---

- name: "2.4.1.1 | PATCH | Ensure cron daemon is enabled and active"
  when: ubtu20cis_rule_2_4_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.1
    - cron
  ansible.builtin.service:
    name: cron
    state: started
    enabled: true

- name: "2.4.1.2 | PATCH | Ensure access to /etc/crontab is configured"
  when: ubtu20cis_rule_2_4_1_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.2
    - cron
  changed_when: false
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    state: touch
    mode: 'go-rwx'

- name: "2.4.1.3 | PATCH | Ensure access to /etc/cron.hourly is configured"
  when: ubtu20cis_rule_2_4_1_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.4.1.3
    - cron
  changed_when: false
  ansible.builtin.file:
    path: /etc/cron.hourly
    owner: root
    group: root
    state: touch
    mode: 'u+rwx,go-rwx'

