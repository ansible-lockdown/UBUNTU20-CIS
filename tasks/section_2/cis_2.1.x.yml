---

- name: "2.1.1 | PATCH | Ensure autofs services are not in use"
  when:
    - ubtu20cis_rule_2_1_1
    - prelim_autofs_service_status.stdout == "loaded"
    - not ubtu20cis_allow_autofs
  tags:
    - level1-server
    - level2-workstation
    - automated
    - patch
    - rule_2.1.1
    - automounting
  ansible.builtin.service:
    name: autofs
    state: stopped
    enabled: false

- name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use"
  when:
    - ubtu20cis_rule_2_1_2
    - not ubtu20cis_avahi_server
    - ubtu20cis_disruption_high
    - "'avahi' in ansible_facts.packages"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.1.2
    - avahi
    - services
  block:
    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use"
      when: prelim_avahi_service_status.stdout == "loaded"
      ansible.builtin.service:
        name: avahi-daemon.service
        state: stopped
        enabled: false

    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use | Stop/Disable avahi-daemon.socket"
      when: prelim_avahi_service_status.stdout == "loaded"
      ansible.builtin.systemd:
        name: avahi-daemon.socket
        state: stopped
        enabled: false

    - name: "2.1.2 | PATCH | Ensure avahi daemon services are not in use | Remove avahi-daemon"
      ansible.builtin.package:
        name: avahi-daemon
        state: absent

