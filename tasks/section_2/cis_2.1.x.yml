- name: "2.1.21 | PATCH | Ensure mail transfer agents are configured for local-only mode"
  when:
    - ubtu20cis_rule_2_1_21
    - not ubtu20cis_is_mail_server
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.1.21
    - postfix
  block:
    - name: "2.1.21 | PATCH | Ensure mail transfer agents are configured for local-only mode | Make changes if exim4 installed"
      when: "'exim4' in ansible_facts.packages"
      ansible.builtin.lineinfile:
        path: /etc/exim4/update-exim4.conf.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      with_items:
        - {regexp: '^dc_eximconfig_configtype', line: "dc_eximconfig_configtype='local'"}
        - {regexp: '^dc_local_interfaces', line: "dc_local_interfaces='127.0.0.1 ; ::1'"}
        - {regexp: '^dc_readhost', line: "dc_readhost=''"}
        - {regexp: '^dc_relay_domains', line: "dc_relay_domains=''"}
        - {regexp: '^dc_minimaldns', line: "dc_minimaldns='false'"}
        - {regexp: '^dc_relay_nets', line: "dc_relay_nets=''"}
        - {regexp: '^dc_smarthost', line: "dc_smarthost=''"}
        - {regexp: '^dc_use_split_config', line: "dc_use_split_config='false'"}
        - {regexp: '^dc_hide_mailname', line: "dc_hide_mailname=''"}
        - {regexp: '^dc_mailname_in_oh', line: "dc_mailname_in_oh='true'"}
        - {regexp: '^dc_localdelivery', line: "dc_localdelivery='mail_spool'"}
      notify: Restart exim4

    - name: "2.1.21 | PATCH | Ensure mail transfer agents are configured for local-only mode | Make changes if postfix is installed"
      when: "'postfix' in ansible_facts.packages"
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^(#)?inet_interfaces'
        line: 'inet_interfaces = loopback-only'
      notify: Restart postfix

    - name: "2.1.21 | PATCH | Ensure mail transfer agents are configured for local-only mode | Message out other main agents"
      when:
        - "'exim4' not in ansible_facts.packages"
        - "'postfix' not in ansible_facts.packages"
      ansible.builtin.debug:
        msg:
          - "Warning!! You are not using either exim4 or postfix"
          - "Please review your vendors documentation to configure local-only mode"

    - name: "2.1.21 | WARN | Ensure mail transfer agent is configured for local-only mode | warn_count"
      when:
        - "'exim4' not in ansible_facts.packages"
        - "'postfix' not in ansible_facts.packages"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.1.21'

- name: "2.1.22 | AUDIT | Ensure only approved services are listening on a network interface"
  when: ubtu20cis_rule_2_1_22
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - rule_2.1.22
    - services
  block:
    - name: "2.1.22 | AUDIT | Ensure only approved services are listening on a network interface | Check for services"
      ansible.builtin.shell: lsof -i -P -n | grep -v "(ESTABLISHED)"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_nonessential_services

    - name: "2.1.22 | AUDIT | Ensure only approved services are listening on a network interface | Message out running services"
      when: discovered_nonessential_services.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! Below are the running services. Please review and remove as well as mask un-needed services"
          - "{{ discovered_nonessential_services.stdout_lines }}"

    - name: "2.1.22 | AUDIT | Ensure only approved services are listening on a network interface | Set warning count"
      when: discovered_nonessential_services.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '2.1.22'
