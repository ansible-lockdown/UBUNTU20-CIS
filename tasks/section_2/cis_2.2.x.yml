---

- name: "2.2.1 | PATCH | Ensure NIS Client is not installed"
  when:
    - ubtu20cis_rule_2_2_1
    - not ubtu20cis_nis_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.2.1
    - nis
  ansible.builtin.package:
    name: nis
    state: absent

- name: "2.2.2 | PATCH | Ensure rsh client is not installed"
  when:
    - ubtu20cis_rule_2_2_2
    - not ubtu20cis_rsh_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.2.2
    - rsh
  ansible.builtin.package:
    name: rsh-client
    state: absent

- name: "2.2.3 | PATCH | Ensure talk client is not installed"
  when:
    - ubtu20cis_rule_2_2_3
    - not ubtu20cis_talk_client_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.2.3
    - talk
  ansible.builtin.package:
    name: talk
    state: absent

- name: "2.2.4 | PATCH | Ensure telnet client is not installed"
  when:
    - ubtu20cis_rule_2_2_4
    - not ubtu20cis_telnet_required
  tags:
    - level1-server
    - level1-workstation
    - automated
