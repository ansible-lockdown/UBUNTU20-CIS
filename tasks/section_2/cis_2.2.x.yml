    - telnet
  ansible.builtin.package:
    name: telnet
    state: absent

- name: "2.2.5 | PATCH | Ensure LDAP client is not installed"
  when:
    - ubtu20cis_rule_2_2_5
    - not ubtu20cis_ldap_clients_required
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_2.2.5
    - ldap
  ansible.builtin.package:
    name: ldap-utils
    state: absent

- name: "2.2.6 | PATCH | Ensure RPC is not installed"
  when:
    - ubtu20cis_rule_2_2_6
    - not ubtu20cis_rpc_required
  tags:
    - level1-server
