---

# ---------------
# ---------------
# NFTables is unsupported with this role. However we have the actions commented out as a guide
# ---------------
# ---------------

- name: "4.3.1 | AUDIT | Ensure nftables is installed"
  when:
    - ubtu20cis_rule_4_3_1
    - ubtu20cis_firewall_package == "nftables"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - rule_4.3.1
    - nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: "4.3.2 | AUDIT | Ensure ufw is uninstalled or disabled with nftables"
  when:
    - ubtu20cis_rule_4_3_2
    - ubtu20cis_firewall_package == "nftables"
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - rule_4.3.2
    - nftables
  ansible.builtin.package:
    name: ufw
    state: absent

- name: "4.3.3 | AUDIT | Ensure iptables are flushed with nftables"
  when:
    - ubtu20cis_rule_4_3_3
    - ubtu20cis_firewall_package == "nftables"
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - rule_4.3.3
    - nftables
  block:
    - name: "4.3.3 | AUDIT | Ensure iptables are flushed with nftables | Alert on findings"
      ansible.builtin.debug:
        msg: "Warning!! NFTables is not supported in this role. Please use UFW, iptables, or manually manage nftables"

    - name: "4.3.3 | AUDIT | Ensure iptables are flushed with nftables | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '4.3.3'

