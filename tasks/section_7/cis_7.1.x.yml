- name: "7.1.10 | PATCH | Ensure permissions on /etc/opasswd are configured"
  when: ubtu20cis_rule_7_1_10
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_7.1.10
    - permissions
  block:
    - name: "7.1.10 | PATCH | Ensure permissions on /etc/opasswd are configured | stat opasswd"
      ansible.builtin.stat:
        path: /etc/opasswd
      register: discovered_opasswd

    - name: "7.1.10 | PATCH | Ensure permissions on /etc/opasswd are configured | opasswd"
      when: discovered_opasswd.stat.exists
      ansible.builtin.file:
        path: /etc/opasswd
        owner: root
        group: root
        mode: 'u=rw,g=,o='
        state: touch

    - name: "7.1.10 | PATCH | Ensure permissions on /etc/opasswd are configured | stat opasswd.old"
      ansible.builtin.stat:
        path: /etc/opasswd.old
      register: discovered_opasswd_old

    - name: "7.1.10 | PATCH | Ensure permissions on /etc/opasswd are configured | set opasswd.old if exists"
      when: discovered_opasswd_old.stat.exists
      ansible.builtin.file:
        path: /etc/opasswd.old
        owner: root
        group: root
        mode: 'u=rw,g=,o='

- name: "7.1.11 | PATCH | Ensure world writable files and directories are secured"
  when: ubtu20cis_rule_7_1_11
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_7.1.11
    - permissions
  block:
    - name: "7.1.11 | AUDIT | Ensure world writable files and directories are secured | Get list of world-writable files"
      ansible.builtin.command: find {{ item.mount }} -xdev -type f -perm -0002 -not -fstype nfs
      with_items:
        - "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_world_writable_files

    - name: "7.1.11 | PATCH | Ensure world writable files and directories are secured | Adjust world-writable files if they exist"
      when: ubtu20cis_no_world_write_adjust
      ansible.builtin.file:
        path: "{{ item }}"
        mode: o-w
      with_items:
        - "{{ discovered_world_writable_files.results | map(attribute='stdout_lines') | flatten }}"

- name: "7.1.12 | PATCH | Ensure no unowned or ungrouped files or directories exist"
  when: ubtu20cis_rule_7_1_12
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_7.1.12
    - permissions
  block:
    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist  | Get unowned files or directories"
      ansible.builtin.command: find {{ item.mount }} -xdev -nouser -not -fstype nfs
      with_items:
        - "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_no_user_items

    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist  | Flatten no_user_items results for easier use"
      ansible.builtin.set_fact:
        discovered_no_user_items_flatten: "{{ discovered_no_user_items.results | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist  | Alert on unowned files and directories"
      when:
        - not ubtu20cis_no_owner_adjust
        - discovered_no_user_items_flatten | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have unowned files and are configured to not auto-remediate for this task"
          - "Please review the files/directories below and assign an owner"
          - "{{ discovered_no_user_items_flatten }}"

    - name: "7.1.12 | PATCH | Ensure no unowned or ungrouped files or directories exist  | Set unowned files/directories to configured owner"
      when:
        - ubtu20cis_no_owner_adjust
        - discovered_no_user_items_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ ubtu20cis_unowned_owner }}"
      with_items:
        - "{{ discovered_no_user_items_flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist | Warn Count"
      when:
        - not ubtu20cis_no_owner_adjust
        - discovered_no_user_items_flatten | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '7.1.12_unowned'

    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist  | Get ungrouped files or directories"
      ansible.builtin.command: find {{ item.mount }} -xdev -nogroup -not -fstype nfs
      with_items:
        - "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_ungrouped_items

    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist  | Flatten ungrouped_items results for easier use"
      ansible.builtin.set_fact:
        discovered_ungrouped_items_flatten: "{{ discovered_ungrouped_items.results | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no unowned or ungrouped files or directories exist  | Alert on ungrouped files and directories"
      when:
        - not ubtu20cis_no_group_adjust
        - discovered_ungrouped_items_flatten | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have ungrouped files/directories and are configured to not auto-remediate for this task"
          - "Please review the files/directories below and assign a group"
          - "{{ discovered_ungrouped_items_flatten }}"

    - name: "7.1.12 | PATCH | Ensure no ungrouped files or directories exist | Set ungrouped files/directories to configured group"
      when:
        - ubtu20cis_no_group_adjust
        - discovered_ungrouped_items_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        group: "{{ ubtu20cis_ungrouped_group }}"
      with_items:
        - "{{ discovered_ungrouped_items_flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no ungrouped files or directories exist | Warn Count"
      when:
        - not ubtu20cis_no_group_adjust
        - discovered_ungrouped_items_flatten | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '7.1.12_ungrouped'

- name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed"
  when: ubtu20cis_rule_7_1_13
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - rule_7.1.13
    - permissions
  block:
    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Find SUID executables"
      ansible.builtin.command: find {{ item.mount }} -xdev -type f -perm -4000 -not -fstype nfs
      with_items:
        - "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_suid_executables

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Flatten suid_executables results for easier use"
      ansible.builtin.set_fact:
        discovered_suid_executables_flatten: "{{ discovered_suid_executables.results | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Alert SUID executables exist"
      when:
        - discovered_suid_executables_flatten | length > 0
        - not ubtu20cis_suid_adjust
      ansible.builtin.debug:
        msg:
          - "Warning!! You have SUID executables"
          - "The files are listed below, please confirm the integrity of these binaries"
          - "{{ discovered_suid_executables_flatten }}"

    - name: "7.1.13 | PATCH | Ensure SUID and SGID files are reviewed | Remove SUID bit"
      when:
        - ubtu20cis_suid_adjust
        - discovered_suid_executables_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'u-s'
      with_items:
        - "{{ discovered_suid_executables_flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | SUID Warn Count"
      when:
        - discovered_suid_executables_flatten | length > 0
        - not ubtu20cis_suid_adjust
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '7.1.13_suid'

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Find SGID executables"
      ansible.builtin.command: find {{ item }} -xdev -type f -perm -2000 -not -fstype nfs
      with_items:
        - "{{ ansible_mounts }}"
      loop_control:
        label: "{{ item.mount }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_sgid_executables

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Flatten sgid_executables results for easier use"
      ansible.builtin.set_fact:
        discovered_sgid_executables_flatten: "{{ discovered_sgid_executables.results | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Alert SGID executables exist"
      when:
        - discovered_sgid_executables_flatten | length > 0
        - not ubtu20cis_sgid_adjust
      ansible.builtin.debug:
        msg:
          - "Warning!! You have SGID executables"
          - "The files are listed below, please review the integrity of these binaries"
          - "{{ discovered_sgid_executables_flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | SGID Warn Count"
      when:
        - discovered_sgid_executables_flatten | length > 0
        - not ubtu20cis_sgid_adjust
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '7.1.13_sgid'

    - name: "7.1.13 | PATCH | Ensure SUID and SGID files are reviewed | Remove SGID bit"
      when:
        - ubtu20cis_sgid_adjust
        - discovered_sgid_executables_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'g-s'
      with_items:
        - "{{ discovered_sgid_executables_flatten }}"
