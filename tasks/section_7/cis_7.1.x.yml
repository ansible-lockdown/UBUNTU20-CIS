---

- name: "7.1.1 | PATCH | Ensure permissions on /etc/passwd are configured"
  when: ubtu20cis_rule_7_1_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - rule_7.1.1
    - permissions
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'

- name: "7.1.2 | PATCH | Ensure permissions on /etc/passwd- are configured"
  when: ubtu20cis_rule_7_1_2
  tags:
    - level1-server
    - level1-workstation
