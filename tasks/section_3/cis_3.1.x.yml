---

- name: "3.1.1 | AUDIT | Ensure IPv6 status is identified"
  when:
    - ubtu20cis_rule_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - rule_3.1.1
    - ipv6
  block:
    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Check sysctl"
      ansible.builtin.command: sysctl net.ipv6.conf.all.disable_ipv6
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_ipv6_sysctl_status

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Check GRUB"
      ansible.builtin.shell: grep -c "ipv6.disable=1" /etc/default/grub || true
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_ipv6_grub_status

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Report status"
      ansible.builtin.debug:
        msg:
          - "IPv6 sysctl status: {{ discovered_ipv6_sysctl_status.stdout | default('unable to determine') }}"
          - "IPv6 disabled in GRUB: {{ 'yes' if discovered_ipv6_grub_status.stdout | int > 0 else 'no' }}"
          - "Verify IPv6 status matches site policy. Set ubtu20cis_ipv6_disable to 'grub' or 'sysctl' to disable."

- name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Disable IPv6 via GRUB"
  when:
    - ubtu20cis_rule_3_1_1
    - not ubtu20cis_ipv6_required
    - ubtu20cis_ipv6_disable == 'grub'
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - rule_3.1.1
    - ipv6
  block:
    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Get current GRUB_CMDLINE_LINUX settings"
      ansible.builtin.shell: grep "GRUB_CMDLINE_LINUX=" /etc/default/grub | cut -f2 -d'"'
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_grub_cmdline_linux_settings

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Add ipv6.disable if does not exist"
      when: "'ipv6.disable' not in discovered_grub_cmdline_linux_settings.stdout"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX'
        line: 'GRUB_CMDLINE_LINUX="{{ discovered_grub_cmdline_linux_settings.stdout }} ipv6.disable=1"'
      notify: Grub update

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Set ipv6.disable to 1 if exists"
      when: "'ipv6.disable' in discovered_grub_cmdline_linux_settings.stdout"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: 'ipv6\.disable=.'
        replace: 'ipv6.disable=1'
      notify: Grub update

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Remove sysctl ipv6 disable"
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^net.ipv6.conf.all.disable_ipv6.*'
        state: absent

- name: "3.1.2 | PATCH | Ensure wireless interfaces are not available"
  when:
    - ubtu20cis_rule_3_1_2
    - prelim_wireless_interfaces.stdout | length > 0
  tags:
    - level1-server
    - level2-workstation
    - automated
    - patch
    - rule_3.1.2
    - wireless
  block:
    - name: "3.1.2 | PATCH | Ensure wireless interfaces are not available | Check for wifi status"
      when: ubtu20cis_install_network_manager
      ansible.builtin.command: nmcli radio wifi
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_wifi_status

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are not available | Disable wireless if enabled nmcli"
      when:
        - ubtu20cis_install_network_manager
        - discovered_wifi_status.stdout == 'enabled'
      ansible.builtin.command: nmcli radio all off
      changed_when: discovered_nmcli_radio_off.rc == 0
      check_mode: false
      register: discovered_nmcli_radio_off

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are not available | disable driver"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/disable_wireless.conf
        regexp: 'install\s*{{ item }}\s*/bin/true'
        line: "install {{ item.line }} /bin/true"
        create: true
        mode: 'u=rw,g=,o='
      loop:
        - "{{ prelim_wireless_interfaces.stdout_lines }}"

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: 'blacklist\s*{{ item }}\s*'
        line: "blacklist {{ item.line }}"
        create: true
        mode: 'u=rw,g=,o='
      loop:
        - "{{ prelim_wireless_interfaces.stdout_lines }}"

- name: "3.1.3 | PATCH | Ensure bluetooth services are not in use"
  when:
    - ubtu20cis_rule_3_1_3
    - "'bluetooth' in ansible_facts.packages"
  tags:
    - level1-server
    - automated
    - patch
    - rule_3.1.3
    - bluetooth
  ansible.builtin.systemd:
    name: bluetooth.service
    state: stopped
    enabled: false
    masked: true
