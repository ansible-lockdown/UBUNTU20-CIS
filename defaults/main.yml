## otherwise the service is stopped and disabled
##
# Service configuration
# Options are
# true to leave installed if exists not changes take place
# false - this removes the package
# mask - if a dependency for product so cannot be removed
# Server Services
# set true if autofs is required for the system
ubtu20cis_allow_autofs: false
ubtu20cis_autofs_services: false
ubtu20cis_autofs_mask: false
ubtu20cis_avahi_server: false
ubtu20cis_avahi_mask: false
ubtu20cis_dhcp_server: false
ubtu20cis_dhcp_mask: false
ubtu20cis_dns_server: false
ubtu20cis_dns_mask: false
ubtu20cis_dnsmasq_server: false
ubtu20cis_dnsmasq_mask: false
ubtu20cis_ftp_server: false
ubtu20cis_ftp_mask: false
ubtu20cis_ldap_server: false
ubtu20cis_ldap_mask: false
# This is for messaging dovecot and dovecot-pop3
ubtu20cis_message_server: false
ubtu20cis_message_mask: false
ubtu20cis_nfs_server: true
# set to true to keep nfs client installed if nfs server is not required
ubtu20cis_nfs_client: false
ubtu20cis_nfs_mask: true
# set to mask if nis client required
ubtu20cis_nis_server: true
ubtu20cis_nis_mask: false
# replaces cups
ubtu20cis_print_server: false
ubtu20cis_print_mask: false
ubtu20cis_rpc_server: true
ubtu20cis_rpc_mask: true
ubtu20cis_rsync_server: false
ubtu20cis_rsync_mask: false
ubtu20cis_samba_server: false
ubtu20cis_samba_mask: false
ubtu20cis_snmp_server: false
ubtu20cis_snmp_mask: false
ubtu20cis_telnet_server: false
ubtu20cis_telnet_mask: false
ubtu20cis_tftp_server: false
ubtu20cis_tftp_mask: false
ubtu20cis_squid_server: false
ubtu20cis_squid_mask: false
ubtu20cis_apache2_server: false
ubtu20cis_apache2_mask: false
ubtu20cis_nginx_server: false
ubtu20cis_nginx_mask: false
ubtu20cis_xinetd_server: false
ubtu20cis_xinetd_mask: false
ubtu20cis_bluetooth_service: false
ubtu20cis_bluetooth_mask: false
# will remove mask not an option
ubtu20cis_xwindows_required: false
ubtu20cis_is_mail_server: false
ubtu20cis_rpc_required: "{{ ubtu20cis_nfs_server or ubtu20cis_nfs_client }}"
ubtu20cis_vsftpd_server: false
# set true if NIS client (ypbind) is needed
ubtu20cis_nis_client_required: false

# Client Services - set to true to keep the client package installed
# NIS client (ypbind)
ubtu20cis_nis_required: false
# RSH client (rsh-client)
ubtu20cis_rsh_required: false
# RSH client (duplicate check)
ubtu20cis_rsh_client: false
# talk client
ubtu20cis_talk_required: false
# telnet client
ubtu20cis_telnet_required: false
# LDAP client (ldap-utils)
ubtu20cis_ldap_clients_required: false
# FTP client
ubtu20cis_ftp_client: false
# talk client (duplicate check)
ubtu20cis_talk_client_required: false

## Purge apt packages
# This will allow the purging of any packages that are marked to be removed
# This will also purge any packages not removed via this playbook
ubtu20cis_purge_apt: false

## Apt/dpkg lock timeout (seconds)
# Wait time for apt/dpkg frontend lock to clear before failing package tasks.
ubtu20cis_apt_lock_timeout: 180

## Section 1 Control Variables

# This will force the tmp_mnt type if not correctly discovered
# either tmp_systemd or fstab
ubtu20cis_expected_tmp_mnt: fstab

# Control 1.1.1.x - toggle for filesystem kernel modules
# set true to allow USB storage devices (not recommended)
ubtu20cis_allow_usb_storage: false

# Control 1.3.1 - allow aide to be configured
ubtu20cis_config_aide: true

# Controls 1.3.1.3 and 1.3.1.4 - AppArmor enforce/complain mode
# set true to disable AppArmor entirely (not recommended)
ubtu20cis_apparmor_disable: false

# Control 1.4.1
# THESE VARIABLES SHOULD BE CHANGED
# This will fail assertion if not changed and rule 1.4.2 is enabled
# insert password as per output of running grub-mkpasswd-pbkdf2
# enable GRUB superuser password
ubtu20cis_set_grub_user_password: false
# GRUB superuser account name
ubtu20cis_grub_user: root
# require password to boot (not just edit)
ubtu20cis_set_boot_pass: false
# GRUB custom config file for superuser
ubtu20cis_grub_user_file: /etc/grub.d/40_custom
# path to GRUB configuration
ubtu20cis_grub_file: /boot/grub/grub.cfg
# CHANGE THIS - output of grub-mkpasswd-pbkdf2
ubtu20cis_bootloader_password_hash: "grub.pbkdf2.sha512.10000.ChangeMe"  # pragma: allowlist secret
# require password for normal boot (not just GRUB edit)
ubtu20cis_ask_passwd_to_boot: false

## Controls 1.5.x
# 1.5.3 - only check if core dump installed
ubtu20cis_core_dump_installed: true

# Controls 1.6.x - Warning banners
ubtu20cis_warning_banner: |
  Authorized users only. All activity may be monitored and reported.

# This variable governs, whether dynamic motd is disabled (as required by control 1.6.1)
ubtu20cis_disable_dynamic_motd: true

# Controls 1.7.x - Settings for GDM
# dconf database name for GNOME settings
ubtu20cis_dconf_db_name: local
# screensaver idle timeout in seconds
ubtu20cis_screensaver_idle_delay: 900

## Section 2 Control Variables

# Controls 2.1.x - Server services
# set to true to keep dovecot mail server installed (controls 2.1.8)
ubtu20cis_dovecot_server: false

# set to true to keep CUPS print server installed (controls 2.1.11)
ubtu20cis_cups_server: false

# set to true to keep Samba server installed (controls 2.1.14)
ubtu20cis_smb_server: false

# set to true to keep Apache2 HTTP server installed (controls 2.1.18)
ubtu20cis_httpd_server: false

# Control 2.3.1.1
# options: systemd-timesyncd, chrony
ubtu20cis_time_sync_tool: "systemd-timesyncd"
# chrony source type: pool or server
ubtu20cis_chrony_timesource: pool

# Controls 2.3.x - Configure time pools & servers
ubtu20cis_time_pool:
  - name: time.nist.gov
    options: iburst maxsources 4

ubtu20cis_time_servers:
  - name: time-a-g.nist.gov
    options: iburst
  - name: time-b-g.nist.gov
    options: iburst
  - name: time-c-g.nist.gov
    options: iburst

## Section 3 Control Variables

# Control 3.1.2
# install NetworkManager for wireless management
ubtu20cis_install_network_manager: true

# IPv4 requirement toggle
ubtu20cis_ipv4_required: true

# IPv6 requirement toggle
ubtu20cis_ipv6_required: false

# Method for disabling IPv6 - grub or sysctl
ubtu20cis_ipv6_disable: grub

# Router toggle
ubtu20cis_is_router: false

# Desktop requirement toggle
ubtu20cis_desktop_required: false

## Section 4 Control Variables

# Controls 4.x - Firewall configuration
# Options: ufw, nftables, iptables, or none
ubtu20cis_firewall_package: "ufw"

# UFW outbound ports
ubtu20cis_ufw_allow_out_ports:
  - 53
  - 80
  - 443

# set true to add incoming firewall rules from list below
ufw_add_incoming: false
ubtu20cis_ufw_allow_in:
  - port: 22
    from: any
    proto: tcp

## Section 5 Control Variables

## 5.3.2.x
# Path to find templates and where to put file for pam-auth
ubtu20cis_pam_confd_dir: 'usr/share/pam-configs/'
### Note: controls also managed with disruption high due to the nature of pam changes
# Create file will create/replace with the name

# Controls 5.3.2.1 - pam_unix
# Name of file for the pam unix configuration
ubtu20cis_pam_pwunix_file: 'pam_unix'
# Should NOT be enabled if allowing custom config that enabled pam_faillock
ubtu20cis_pam_create_pamunix_file: false
# Allow pam-auth-update --enable ubtu20cis_pam_pwunix_file to run
ubtu20cis_pam_auth_unix: true

# 5.3.2.2 - pam_faillock
# Name of files for pam
ubtu20cis_pam_faillock_file: 'faillock'
ubtu20cis_pam_faillock_notify_file: 'faillock_notify'
# Allow pam-auth-update --enable ubtu20cis_pam_faillock_file
# and
# Allow pam-auth-update --enable ubtu20cis_pam_faillock_notify_file
ubtu20cis_pam_auth_faillock: true
# Allow new file to be created or overwrite existing with same name
ubtu20cis_pam_create_faillock_files: true

# 5.3.2.3 - pam_pwquality
# Name of file for pwquality
ubtu20cis_pam_pwquality_file: 'pwquality'
# Allow new file to be created or overwrite existing with same name
ubtu20cis_pam_create_pwquality_files: true

# 5.3.2.4 - pam_pwhistory
# Name of file for the pam history file
ubtu20cis_pam_pwhistory_file: 'pwhistory'
# Allow new file to be created or overwrite existing with same name
# filepath also affects controls 5.3.3.3.1, 5.3.3.3.2, 5.3.3.3.3
ubtu20cis_pam_create_pwhistory_files: true

# 5.3.3.1.1 - faillock_deny
# Lock system using faillock fate 3 bad tries
ubtu20cis_faillock_deny: 3

# 5.3.3.1.2 - faillock unlock time
# Timeout before releasing the faillock on an account
ubtu20cis_faillock_unlock_time: 900

# 5.3.3.1.3 - lock root
# This gives the ability to even_deny_root and or add a root_unlock_time in the options
# Option is used for the regexp to be amended and string is what to replace with.
ubtu20cis_pamroot_lock_option: even_deny_root
ubtu20cis_pamroot_lock_string: even_deny_root

# 5.3.3.2.1 - password difok
# Pam difok settings - file and number of difference that must take place in the file
# difok = the minimum number of characters that must be different from the old password
ubtu20cis_passwd_difok_file: etc/security/pwquality.conf.d/50-pwdifok.conf  # pragma: allowlist secret
ubtu20cis_passwd_difok_value: 2

# 5.3.3.2.2 - password minlength
# minlen = minimum password length
ubtu20cis_passwd_minlen_file: etc/security/pwquality.conf.d/50-pwlength.conf  # pragma: allowlist secret
ubtu20cis_passwd_minlen_value: 14

# 5.3.3.2.3 - password complex
ubtu20cis_passwd_complex_file: etc/security/pwquality.conf.d/50-pwcomplexity.conf  # pragma: allowlist secret
# minclass = the minimum number of character types that must be used (i.e., uppercase, lowercase, digits, other)
ubtu20cis_passwd_minclass: 3
# dcredit = maximum number of digits that will generate a credit
ubtu20cis_passwd_dcredit: -1
# ucredit = maximum number of uppercase characters that will generate a credit
ubtu20cis_passwd_ucredit: -2
# ocredit = maximum number of other characters that will generate a credit
ubtu20cis_passwd_ocredit: 0
# lcredit = maximum number of lowercase characters that will generate a credit
ubtu20cis_passwd_lcredit: -2

# 5.3.3.2.4 - password maxrepeat
# maxrepeat = the maximum number of times a single character may be repeated
ubtu20cis_passwd_maxrepeat_file: etc/security/pwquality.conf.d/50-pwrepeat.conf  # pragma: allowlist secret
ubtu20cis_passwd_maxrepeat_value: 3

# 5.3.3.2.5 - password maxsequence
ubtu20cis_passwd_maxsequence_file: etc/security/pwquality.conf.d/50-pwmaxsequence.conf  # pragma: allowlist secret
ubtu20cis_passwd_maxsequence_value: 3

# 5.3.3.2.6 - password dictcheck
# dictcheck = whether to check for the words from the cracklib dictionary (enabled if the value is not 0)
ubtu20cis_passwd_dictcheck_file: etc/security/pwquality.conf.d/50-pwdictcheck.conf  # pragma: allowlist secret
ubtu20cis_passwd_dictcheck_value: 1

# 5.3.3.2.7 - password quality enforce
# enforcing = new password is rejected if it fails the check and the value is not 0
ubtu20cis_passwd_quality_enforce_file: etc/security/pwquality.conf.d/50-pwquality_enforce.conf  # pragma: allowlist secret
ubtu20cis_passwd_quality_enforce_value: 1

# 5.3.3.2.8 - password quality enforce for root included with 5.3.3.2.7
# enforce_for_root: This ensures that the password policies are adhered to even if its the root user configuring the passwords.
ubtu20cis_passwd_quality_enforce_root_file: etc/security/pwquality.conf.d/50-pwroot.conf  # pragma: allowlist secret
ubtu20cis_passwd_quality_enforce_root_value: enforce_for_root  # pragma: allowlist secret

## 5.3.3.3 Configure pam_pwhistory module
# Uses value for ubtu20cis_pam_pwhistory_file in 5.3.2.4
# Control 5.3.3.3.1
# This variable represents the number of password change cycles, after which
# a user can re-use a password. # CIS requires a value of 24 or more.
ubtu20cis_pamd_pwhistory_remember: 24

# SSH configuration - maps to sshd_config directives
ubtu20cis_sshd:
  # LogLevel - VERBOSE for detailed logging
  log_level: "INFO"
  # MaxAuthTries - max failed auth attempts per connection
  max_auth_tries: 4
  # approved encryption ciphers
  ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
  # approved MACs
  macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
  # approved key exchange algorithms
  kex_algorithms: "curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256"
  # seconds between keepalive messages
  client_alive_interval: 300
  # max keepalive failures before disconnect
  client_alive_count_max: 3
  # seconds to authenticate before disconnect
  login_grace_time: 60
  # max concurrent sessions per connection
  max_sessions: 4
  # CHANGE THIS - space-separated list of allowed SSH users
  allow_users: "vagrant ubuntu"
  # CHANGE THIS - space-separated list of allowed SSH groups
  allow_groups: "vagrant ubuntu"

# Sudo configuration
# sudo package name (sudo or sudo-ldap)
ubtu20cis_sudo_package: "sudo"
# sudo log file path
ubtu20cis_sudo_logfile: "/var/log/sudo.log"
# minutes before sudo requires re-authentication
ubtu20cis_sudo_timestamp_timeout: 15
# group allowed to use su (set to restrict su access)
ubtu20cis_sugroup: nosugroup

# PAM configuration
# password hashing algorithm (sha512 or yescrypt)
ubtu20cis_passwd_hash_algo: sha512  # pragma: allowlist secret
ubtu20cis_pam_password:
  # minimum password length
  minlen: "14"
  # minimum number of character classes (upper, lower, digit, special)
  minclass: "4"
# max password change retries before failure
ubtu20cis_pam_passwd_retry: "3"
# pam_pwhistory enforced password history depth
ubtu20cis_pwhistory_so: "14"
# pam_unix remembered passwords to prevent reuse
ubtu20cis_passwd_remember: "5"

# Password policy - maps to /etc/login.defs
ubtu20cis_pass:
  # PASS_MAX_DAYS - max days between password changes
  max_days: 365
  # PASS_MIN_DAYS - min days between password changes
  min_days: 1
  # PASS_WARN_AGE - days warning before password expires
  warn_age: 7
  # INACTIVE - days after expiry before account is locked
  inactive: 30
  # difok - min characters that must differ from old password
  character_changed: 5
  # maxrepeat - max consecutive identical characters
  max_repeat_letters: 3

# Shell timeout
ubtu20cis_shell_session_timeout:
  file: /etc/profile.d/tmout.sh
  timeout: 900

# default umask for bash sessions (027 = rwxr-x---)
ubtu20cis_bash_umask: '027'

# Root password - encrypted hash prefix to verify root has a valid password set
# SHA-512 hash prefix ($6$=sha512, $y$=yescrypt)
ubtu20cis_root_pw: $6$

## Section 6 Control Variables

# AIDE configuration
# 6.1.2 - aide scan method (cron or timer)
ubtu20cis_aide_scan: cron
ubtu20cis_aide_cron:
  cron_user: root
  cron_file: /etc/cron.d/aide_cron
  aide_job: '/usr/bin/aide.wrapper --config /etc/aide/aide.conf --check'
  aide_minute: 0
  aide_hour: 5
  aide_day: '*'
  aide_month: '*'
  aide_weekday: '*'

# Logging - syslog service (rsyslog or journald)
# options: rsyslog, journald
ubtu20cis_syslog_service: 'rsyslog'
# set true if this host receives remote journal logs
journald_log_server: false
# set true if this host is a central log server
ubtu20cis_system_is_log_server: false

# Journald Settings - systemd-journal-upload configuration
ubtu20cis_journal_upload:
  # URL of remote journal server (e.g., https://loghost:19532)
  remote_url:
  # path to TLS server key file
  serverkeyfile:
  # path to TLS server certificate file
  servercertfile:
  # additional journald.conf overrides
  ubtu20cis_journald:

# Journald log rotation - maps to journald.conf storage limits
ubtu20cis_journald_log_rotate:
  # max persistent journal disk usage (e.g., 4G)
  systemmaxuse:
  # min free disk space to maintain (e.g., 1G)
  systemkeepfree:
  # max volatile journal memory usage (e.g., 256M)
  runtimemaxuse:
  # min free memory to maintain (e.g., 128M)
  runtimekeepfree:
  # max time to store entries in a single file (e.g., 1month)
  maxfilesec:

# logrotate - rotation frequency for rsyslog and other log files
# options: daily, weekly, monthly, yearly
ubtu20cis_logrotate: "daily"

# rsyslog
# add Ansible managed header to rsyslog config
ubtu20cis_rsyslog_ansible_managed: true
# CHANGE THIS - remote syslog server IP/hostname
ubtu20cis_remote_log_server: 192.168.2.100
# remote syslog host (used in rsyslog omfwd action)
ubtu20cis_remote_log_host: "192.168.2.100"
# remote syslog port
ubtu20cis_remote_log_port: "514"
# remote syslog protocol (tcp or udp)
ubtu20cis_remote_log_protocol: "tcp"

# auditd - audit daemon configuration
# kernel audit backlog limit (boot parameter)
ubtu20cis_audit_back_log_limit: 8192
# max audit log file size in MB
ubtu20cis_max_log_file_size: 10
ubtu20cis_auditd:
  # action when admin space threshold reached (halt/single/email)
  admin_space_left_action: halt
  # action when max log file size reached (keep_logs/rotate/compress)
  max_log_file_action: keep_logs
  # action when disk space low (email/exec/syslog)
  space_left_action: email
  # email account for space warnings
  action_mail_acct: root
  # auditd internal backlog limit
  auditd_backlog_limit: 8192

## Section 7 Control Variables

# Toggle to remove world-writable perms from all files
ubtu20cis_no_world_write_adjust: true

# Owner/group for unowned files
# owner to assign to files with no valid owner
ubtu20cis_unowned_owner: root
# set true to fix ownership on unowned files
ubtu20cis_no_owner_adjust: true
# group to assign to files with no valid group
ubtu20cis_ungrouped_group: root
# set true to fix group on ungrouped files
ubtu20cis_no_group_adjust: true

# SUID/SGID toggles
# set true to remove unexpected SUID bits (CAUTION: may break apps)
ubtu20cis_suid_adjust: false
# set true to remove unexpected SGID bits (CAUTION: may break apps)
ubtu20cis_sgid_adjust: false
